        metrics: { peak1s: p.max1, peak10s: p.max10, peak60s: p.max60, requests: p.cnt, avgRps: +p.rate.toFixed(2), uniquePaths: p.uPaths, err4xx: p.c4, err5xx: p.c5, country: p.country },
        entities: { ips: [p.ip], paths: [] },
        evidence: [`UA: ${p.ua || '(none)'}`, `${p.uPaths} distinct paths, ${p.uUA} distinct user agents`, `Bytes out ${(p.bout / 1e6).toFixed(1)} MB`],
        mitre: ['T1498.001 Direct Network Flood'],
        action: `Alteon: rate-limit or block ${p.ip} (ACL / DoS profile per-source limit ${Math.max(5, Math.round(p.max1 / 4))} rps).`,
        query: `src = "${p.ip}"`
      }));
    }
  }

  /* ---- D04 slow-rate attacks (Slowloris / RUDY / slow read) ---- */
  {
    const slow = profs.filter(p => !p.allow && p.cnt >= 5 && (p.e2e / p.cnt) >= cfg.slowMs && (p.bin / p.cnt) < 4096);
    for (const p of slow.slice(0, 40)) {
      const avgE2e = p.e2e / p.cnt, concurrency = p.span > 0 ? (p.cnt * avgE2e) / p.span : p.cnt;
      const score = sc(45 + Math.log10(1 + avgE2e / 1000) * 18 + clamp(concurrency, 0, 25));
      F.push(mkFinding({
        det: 'D04', title: `Slow-rate attack pattern — ${p.ip} holds ~${Math.round(concurrency)} concurrent slow requests`,
        category: 'Availability / resource exhaustion', score, confidence: .72,
        from: p.first, to: p.last,
        metrics: { avgEndToEndMs: Math.round(avgE2e), maxEndToEndMs: Math.round(p.maxE2e), avgRequestBytes: Math.round(p.bin / p.cnt), estConcurrency: +concurrency.toFixed(1), requests: p.cnt },
        entities: { ips: [p.ip] },
        evidence: [
          `Requests are long-lived (${(avgE2e / 1000).toFixed(1)}s avg) but carry almost no payload (${Math.round(p.bin / p.cnt)} B) — the signature of Slowloris / slow-POST / slow-read.`,
          `Little's Law concurrency estimate ≈ ${concurrency.toFixed(1)} sockets held open.`,
          `Backend RTT contribution ${Math.round(p.srtt / p.cnt)} ms — ${p.srtt / p.cnt < avgE2e * .2 ? 'the delay is client-side, not backend' : 'backend is also slow here'}.`
        ],
        mitre: ['T1499.003 Application Exhaustion Flood'],
        action: 'Alteon: shorten client request/idle timeouts on the VIP, cap concurrent connections per source, enable HTTP request-buffering so the backend never sees partial requests.',
        query: `src = "${p.ip}" and e2e > ${Math.round(cfg.slowMs)}`
      }));
    }
  }

  /* ---- D05 scanner / content discovery + D15 payload signatures ---- */
  for (const p of profs.slice(0, 2000)) {
    if (p.allow) continue;
    const r404 = p.c404 / p.cnt;
    const scanner = (p.uPaths >= cfg.scanUniquePaths && r404 >= cfg.scan404Ratio) || p.tool || (p.uPaths >= cfg.scanUniquePaths * 2 && p.uPaths / p.cnt > .8);
    if (scanner && !p.crawler) {
      const score = sc(40 + (p.tool ? 30 : 0) + clamp(p.uPaths / 10, 0, 20) + r404 * 25);
      F.push(mkFinding({
        det: 'D05', title: `${p.tool ? 'Security scanner' : 'Content discovery / enumeration'} — ${p.ip}${p.tool ? ' (' + p.ua.slice(0, 48) + ')' : ''}`,
        category: 'Reconnaissance', score, confidence: p.tool ? .95 : .7,
        from: p.first, to: p.last,
        metrics: { uniquePaths: p.uPaths, requests: p.cnt, ratio404: +r404.toFixed(3), status404: p.c404, status403: p.c403, pathEntropy: +p.pEnt.toFixed(2), peak1s: p.max1 },
        entities: { ips: [p.ip] },
        evidence: [
          `${p.uPaths} distinct paths over ${p.cnt} requests (${(p.uPaths / p.cnt * 100).toFixed(0)}% unique) — walking a wordlist, not browsing.`,
          `Path entropy ${p.pEnt.toFixed(2)} bits; ${(r404 * 100).toFixed(0)}% of responses were 404.`,
          p.sigHits ? `Also carried ${p.sigHits} payloads matching: ${p.sigKinds.join(', ')}.` : `No injection payloads yet — this is the mapping phase.`,
          `UA: ${p.ua || '(absent)'}`
        ],
        mitre: ['T1595.003 Wordlist Scanning', 'T1590 Gather Victim Network Information'],
        action: p.tool ? `Block ${p.ip} outright; the tool signature is unambiguous. Then verify nothing it found returned 200.` : `Alteon/AppWall: apply a 404-rate throttle per source and a bot challenge; review any 200 responses this source received.`,
        query: `src = "${p.ip}"`
      }));
    }
    if (p.sigHits >= 3) {
      const score = sc(55 + p.sigKinds.length * 8 + Math.log10(1 + p.sigHits) * 12 + (p.c2 > 0 ? 12 : 0));
      F.push(mkFinding({
        det: 'D15', title: `Injection payloads from ${p.ip} — ${p.sigKinds.slice(0, 3).join(', ')}${p.sigKinds.length > 3 ? ' +' + (p.sigKinds.length - 3) : ''}`,
        category: 'Exploitation attempt', score, confidence: .88,
        from: p.first, to: p.last,
        metrics: { payloadRequests: p.sigHits, classes: p.sigKinds.length, success2xx: p.c2, blocked: p.blocked, requests: p.cnt },
        entities: { ips: [p.ip] },
        evidence: [
          `Matched signature classes: ${p.sigKinds.join(', ')}.`,
          p.blocked ? `${p.blocked} request(s) were blocked/mitigated by policy.` : `No enforcement action recorded on these requests — verify AppWall policy coverage for this content class.`,
          p.c2 > 0 ? `⚠ ${p.c2} requests from this source returned 2xx — confirm none of the payload requests succeeded.` : `No 2xx responses to this source.`
        ],
        mitre: ['T1190 Exploit Public-Facing Application'],
        action: 'AppWall: confirm the relevant signature groups are in Active (not Passive) mode for this policy; block the source and export the matching requests for the app team.',
        query: `src = "${p.ip}"`
      }));
    }
  }

  /* ---- D06 404 storm / path anomaly ---- */
  {
    const b4 = robustBands(H.a404);
    const t4 = Math.max(b4.med + 4 * b4.sigma, 5);
    for (const [a, b] of findRuns(H.a404, t4, 2).slice(0, 3)) {
      let n = 0; for (let x = a; x <= b; x++) n += H.a404[x];
      const from = H.t0 + a * H.w, to = H.t0 + (b + 1) * H.w;
      const paths = new Map(), srcs = new Map();
      forEachScope(i => { if (C.ts.a[i] >= from && C.ts.a[i] < to && C.statusn.a[i] === 404) { paths.set(C.path.codes[i], (paths.get(C.path.codes[i]) || 0) + 1); srcs.set(C.src.codes[i], 1); } });
      F.push(mkFinding({
        det: 'D06', title: `404 storm — ${Math.round(n).toLocaleString()} not-found responses in ${Math.round((to - from) / 1000)}s`,
        category: 'Reconnaissance', score: sc(35 + Math.log10(1 + n) * 15), confidence: .75,
        from, to,
        metrics: { notFound: Math.round(n), sources: srcs.size, distinctPaths: paths.size, baselinePerBin: +b4.med.toFixed(1) },
        entities: { ips: topN(srcs, 10, c => C.src.val(c)).map(x => x.k), paths: topN(paths, 10, c => C.path.val(c)).map(x => x.k) },
        evidence: [`${paths.size} distinct missing paths from ${srcs.size} source(s).`, `Most probed: ${topN(paths, 4, c => C.path.val(c)).map(x => x.k).join(', ')}`],
        mitre: ['T1595 Active Scanning'],
        action: 'Throttle per-source 404 rate at the ADC; if the paths look like a known wordlist, add a virtual-patch rule so probes get a fixed 403 rather than reaching the origin.',
        query: `status = 404 and ts>=${Math.floor(from)} and ts<=${Math.floor(to)}`
      }));
    }
    // brand-new paths appearing late in the timeline with volume
    const lateCut = idx.tmin + (idx.tmax - idx.tmin) * .8;
    const firstSeen = new Map(), cnts = new Map();
    forEachScope(i => { const pc = C.path.codes[i], t = C.ts.a[i]; if (!firstSeen.has(pc) || t < firstSeen.get(pc)) firstSeen.set(pc, t); cnts.set(pc, (cnts.get(pc) || 0) + 1); });
    const emerging = Array.from(firstSeen.entries()).filter(([pc, t]) => t >= lateCut && cnts.get(pc) >= Math.max(20, avgRps)).sort((a, b) => cnts.get(b[0]) - cnts.get(a[0])).slice(0, 8);
    if (emerging.length) {
      F.push(mkFinding({
        det: 'D06b', title: `${emerging.length} endpoint(s) appeared only in the last 20% of the capture`,
        category: 'Behaviour change', score: 42, confidence: .55,
        from: lateCut, to: idx.tmax,
        metrics: { newPaths: emerging.length, topVolume: cnts.get(emerging[0][0]) },
        entities: { paths: emerging.map(([pc]) => C.path.val(pc)) },
        evidence: emerging.slice(0, 5).map(([pc, t]) => `${C.path.val(pc)} — first seen ${fmtT(t)}, ${cnts.get(pc)} requests`),
        action: 'Confirm with the app team that these are an expected release. Unannounced high-volume endpoints are either a deploy nobody told you about or a foothold.',
        query: `path in (${emerging.slice(0, 5).map(([pc]) => '"' + C.path.val(pc) + '"').join(', ')})`
      }));
    }
  }

  /* ---- D07 credential brute force / D08 spray & stuffing ---- */
  {
    const brute = profs.filter(p => !p.allow && p.auth >= cfg.credFail && (p.c401 + p.c403) >= cfg.credFail * .5);
    for (const p of brute.slice(0, 25)) {
      const fails = p.c401 + p.c403, ratio = fails / Math.max(1, p.auth);
      const score = sc(50 + Math.log10(1 + fails) * 18 + ratio * 20);
      F.push(mkFinding({
        det: 'D07', title: `Credential brute force — ${p.ip}, ${fails} auth failures`,
        category: 'Credential access', score, confidence: .82,
        from: p.first, to: p.last,
        metrics: { authRequests: p.auth, failures: fails, status401: p.c401, status403: p.c403, success2xx: p.c2, rateRps: +p.rate.toFixed(2) },
        entities: { ips: [p.ip] },
        evidence: [
          `${p.auth} requests to authentication endpoints, ${(ratio * 100).toFixed(0)}% rejected.`,
          p.c2 > 0 ? `⚠ ${p.c2} 2xx responses in the same session — a success inside a brute-force run is a probable account compromise.` : 'No successful authentication observed from this source.',
          `Cadence CV ${p.gapCV.toFixed(2)} ${p.gapCV < .3 ? '(machine-regular)' : '(irregular — possibly human or jittered)'}.`
        ],
        mitre: ['T1110.001 Password Guessing'],
        action: 'Block or step-up-challenge the source; force password reset for any account that returned 2xx during this window; enable AppWall Brute Force protection on the login content class.',
        query: `src = "${p.ip}" and path ~ "login"`
      }));
    }
    // distributed: many sources, few attempts each, same auth endpoints
    const authPaths = new Map(), authSrcs = new Map();
    forEachScope(i => {
      const p = C.path.val(C.path.codes[i]);
      if (!RE_AUTH.test(p)) return;
      const st = C.statusn.a[i];
      if (st !== 401 && st !== 403 && st !== 200 && st !== 302) return;
      const key = C.path.codes[i];
      if (!authPaths.has(key)) authPaths.set(key, { n: 0, fail: 0, ok: 0, srcs: new Map(), ctry: new Map(), ua: new Map(), from: Infinity, to: 0 });
      const a = authPaths.get(key); a.n++;
      if (st === 401 || st === 403) a.fail++; else a.ok++;
      a.srcs.set(C.src.codes[i], (a.srcs.get(C.src.codes[i]) || 0) + 1);
      a.ctry.set(C.country.codes[i], 1); a.ua.set(C.ua.codes[i], 1);
      const t = C.ts.a[i]; if (t < a.from) a.from = t; if (t > a.to) a.to = t;
    });
    for (const [pc, a] of authPaths) {
      if (a.srcs.size < cfg.credSprayHosts || a.n < cfg.credSprayHosts) continue;
      const per = a.n / a.srcs.size, failRate = a.fail / a.n;
      if (per > 6 || failRate < .5) continue;
      const score = sc(55 + Math.log10(1 + a.srcs.size) * 18 + failRate * 20);
      F.push(mkFinding({
        det: 'D08', title: `Distributed credential attack on ${C.path.val(pc)} — ${a.srcs.size} sources, ${per.toFixed(1)} attempts each`,
        category: 'Credential access', score, confidence: .8,
        from: a.from, to: a.to,
        metrics: { endpoints: 1, attempts: a.n, sources: a.srcs.size, attemptsPerSource: +per.toFixed(2), failureRate: +failRate.toFixed(3), successes: a.ok, countries: a.ctry.size, userAgents: a.ua.size },
        entities: { paths: [C.path.val(pc)], ips: topN(a.srcs, 15, c => C.src.val(c)).map(x => x.k) },
        evidence: [
          `Each source stays under a typical per-IP threshold (${per.toFixed(1)} attempts) — this is designed to defeat naive rate limiting.`,
          `${a.ctry.size} countries and ${a.ua.size} user agents involved.`,
          a.ok > 0 ? `⚠ ${a.ok} apparent successes — treat as credential stuffing with hits.` : 'No successes observed.'
        ],
        mitre: ['T1110.003 Password Spraying', 'T1110.004 Credential Stuffing'],
        action: 'Rate-limit per account/username rather than per IP; enable AppWall Bot Manager on the login flow; require MFA and check the successful logins against known-good geo/device.',
        query: `path = "${C.path.val(pc)}" and status in (401, 403)`
      }));
    }
  }

  /* ---- D09 backend saturation + D10 5xx spike ---- */
  {
    const byServer = new Map();
    forEachScope(i => {
      const key = C.serverid.codes[i] ? 'id:' + C.serverid.val(C.serverid.codes[i]) : 'ip:' + C.server.val(C.server.codes[i]);
      if (!key || key === 'ip:') return;
      if (!byServer.has(key)) byServer.set(key, { n: 0, srtt: [], e5: 0, e4: 0, bout: 0, from: Infinity, to: 0 });
      const o = byServer.get(key); o.n++;
      if (C.srtt.a[i] > 0 && o.srtt.length < 200000) o.srtt.push(C.srtt.a[i]);
      const st = C.statusn.a[i]; if (st >= 500) o.e5++; else if (st >= 400) o.e4++;
      o.bout += C.bout.a[i];
      const t = C.ts.a[i]; if (t < o.from) o.from = t; if (t > o.to) o.to = t;
    });
    const allSrtt = []; for (const o of byServer.values()) for (let k = 0; k < o.srtt.length; k += Math.max(1, Math.floor(o.srtt.length / 5000))) allSrtt.push(o.srtt[k]);
    const gs = Float64Array.from(allSrtt).sort(); const gp95 = pct(gs, .95), gp50 = pct(gs, .5);
    for (const [key, o] of byServer) {
      if (o.n < 30) continue;
      const ss = Float64Array.from(o.srtt).sort();
      const p50 = pct(ss, .5), p95 = pct(ss, .95), p99 = pct(ss, .99);
      const e5r = o.e5 / o.n;
      const slow = gp95 > 0 && p95 > gp95 * cfg.satP95Mult;
      if (!slow && e5r < .05) continue;
      const conc = o.to > o.from ? (o.n * (p50 || 1)) / (o.to - o.from) : 0;
      const score = sc(35 + (slow ? 30 : 0) + e5r * 120 + clamp(Math.log10(1 + p95 / Math.max(1, gp50)) * 20, 0, 25));
      F.push(mkFinding({
        det: 'D09', title: `Backend saturation — ${key} p95 ${Math.round(p95)} ms${e5r > .05 ? `, ${(e5r * 100).toFixed(1)}% 5xx` : ''}`,
        category: 'Backend health', score, confidence: .78,
        from: o.from, to: o.to,
        metrics: { requests: o.n, p50Ms: Math.round(p50), p95Ms: Math.round(p95), p99Ms: Math.round(p99), fleetP95Ms: Math.round(gp95), rate5xx: +e5r.toFixed(4), errors5xx: o.e5, estConcurrency: +conc.toFixed(2), egressMB: +(o.bout / 1e6).toFixed(1) },
        entities: { servers: [key] },
        evidence: [
          `This member is ${(p95 / Math.max(1, gp95)).toFixed(1)}× the fleet p95 (${Math.round(gp95)} ms).`,
          `Estimated in-flight concurrency ${conc.toFixed(1)} (Little's Law: arrival rate × service time).`,
          o.e5 ? `${o.e5} 5xx responses — check whether the ADC health check is still passing while the member is effectively down.` : 'No 5xx yet; latency is the leading indicator.'
        ],
        action: 'Alteon: verify health-check depth (a TCP-only check will keep a saturated member in rotation), lower slow-start weight, and consider least-connections over round-robin for this group.',
        query: key.startsWith('id:') ? `serverid = "${key.slice(3)}"` : `server = "${key.slice(3)}"`
      }));
    }
    const b5 = robustBands(H.e5);
    for (const [a, b] of findRuns(H.e5, Math.max(b5.med + 5 * b5.sigma, 5), 2).slice(0, 5)) {
      let n = 0; for (let x = a; x <= b; x++) n += H.e5[x];
      let tot = 0; for (let x = a; x <= b; x++) tot += H.all[x];
      F.push(mkFinding({
        det: 'D10', title: `Availability incident — ${Math.round(n).toLocaleString()} 5xx over ${Math.round((b - a + 1) * H.w / 1000)}s (${(n / Math.max(1, tot) * 100).toFixed(1)}% of traffic)`,
        category: 'Availability', score: sc(45 + (n / Math.max(1, tot)) * 60), confidence: .9,
        from: H.t0 + a * H.w, to: H.t0 + (b + 1) * H.w,
        metrics: { errors5xx: Math.round(n), requestsInWindow: Math.round(tot), errorRate: +(n / Math.max(1, tot)).toFixed(4) },
        evidence: ['Error budget burn during this window; correlate with the backend-saturation findings and any deploy events.'],
        action: 'Check origin health, connection-pool exhaustion, and whether the flood findings overlap this window — 5xx under load usually means capacity, 5xx without load usually means a code or dependency failure.',
        query: `status >= 500 and ts>=${Math.floor(H.t0 + a * H.w)} and ts<=${Math.floor(H.t0 + (b + 1) * H.w)}`
      }));
    }
  }
  return F;
}

/* ---------------------- detectors, second half ---------------------- */
function runDetectors2() {
  const s = E.store, C = s.cols, idx = E.idx, cfg = E.cfg, F = [];
  const profs = E.profiles || buildProfiles();
  const dna = E.dna || buildDNA();
  const total = selCount();
  if (!total) return F;

  /* ---- D11 TLS posture ---- */
  {
    const tlsMap = new Map(), cipMap = new Map(), weakSrc = new Map();
    let weak = 0, nopfs = 0, tlsRows = 0;
    forEachScope(i => {
      const t = C.tls.val(C.tls.codes[i]), c = C.cipher.val(C.cipher.codes[i]);
      if (!t && !c) return; tlsRows++;
      if (t) tlsMap.set(t, (tlsMap.get(t) || 0) + 1);
      if (c) cipMap.set(c, (cipMap.get(c) || 0) + 1);
      const bad = (t && WEAK_TLS.test(t)) || (c && WEAK_CIPHER.test(c));
      if (bad) { weak++; weakSrc.set(C.src.codes[i], (weakSrc.get(C.src.codes[i]) || 0) + 1); }
      else if (c && NOPFS_CIPHER.test(c)) nopfs++;
    });
    if (weak > 0) {
      const r = weak / Math.max(1, tlsRows);
      F.push(mkFinding({
        det: 'D11', title: `Weak TLS in use — ${weak.toLocaleString()} sessions (${(r * 100).toFixed(2)}% of TLS traffic)`,
        category: 'Cryptographic posture', score: sc(45 + r * 120), confidence: .95,
        from: idx.tmin, to: idx.tmax,
        metrics: { weakSessions: weak, tlsSessions: tlsRows, share: +r.toFixed(4), noPFS: nopfs, sources: weakSrc.size },
        entities: { ips: topN(weakSrc, 10, c => C.src.val(c)).map(x => x.k) },
        evidence: [
          `Versions seen: ${topN(tlsMap, 6).map(x => x.k + ' ' + (x.v / tlsRows * 100).toFixed(1) + '%').join(', ')}`,
          `Ciphers seen: ${topN(cipMap, 5).map(x => x.k).join(', ')}`,
          nopfs ? `${nopfs} sessions negotiated a suite without forward secrecy.` : 'All non-weak suites offer forward secrecy.'
        ],
        mitre: ['T1040 Network Sniffing (downstream risk)'],
        action: 'Alteon SSL policy: disable TLS 1.0/1.1 and CBC/RC4/3DES suites on the front-end. Use the source list here to size the client-compatibility impact before you flip it.',
        query: `tls in ("${Array.from(tlsMap.keys()).filter(t => WEAK_TLS.test(t)).join('", "')}")`
      }));
    }
    // clients negotiating modern TLS with archaic HTTP versions = tooling
    const mismatch = profs.filter(p => !p.allow && /1\.3|1\.2/.test(p.tls) && /1\.0|0\.9/.test(p.httpv) && p.cnt >= 20);
    if (mismatch.length) {
      F.push(mkFinding({
        det: 'D11b', title: `${mismatch.length} client(s) pair modern TLS with HTTP/1.0 — scripted, not a browser`,
        category: 'Client fingerprint anomaly', score: 48, confidence: .7,
        from: idx.tmin, to: idx.tmax,
        metrics: { clients: mismatch.length, requests: mismatch.reduce((a, b) => a + b.cnt, 0) },
        entities: { ips: mismatch.slice(0, 15).map(p => p.ip) },
        evidence: mismatch.slice(0, 5).map(p => `${p.ip} — ${p.tls} / ${p.httpv} / UA "${(p.ua || '∅').slice(0, 40)}" — ${p.cnt} requests`),
        action: 'No real browser negotiates TLS 1.3 and then speaks HTTP/1.0. Treat as automation and score accordingly in your bot policy.',
        query: `httpv ~ "1.0"`
      }));
    }
  }

  /* ---- D12 SNI / Host mismatch ---- */
  {
    const mm = new Map(); let n = 0;
    forEachScope(i => {
      const sni = C.sni.val(C.sni.codes[i]), host = C.host.val(C.host.codes[i]);
      if (!sni || !host) return;
      if (sni.toLowerCase() !== host.toLowerCase().split(':')[0]) {
        n++; const k = sni + ' → ' + host;
        mm.set(k, (mm.get(k) || 0) + 1);
      }
    });
    if (n >= 10) {
      F.push(mkFinding({
        det: 'D12', title: `SNI/Host header mismatch on ${n.toLocaleString()} requests`,
        category: 'Protocol abuse', score: sc(45 + Math.log10(1 + n) * 12), confidence: .8,
        from: idx.tmin, to: idx.tmax,
        metrics: { mismatches: n, distinctPairs: mm.size },
        evidence: topN(mm, 6).map(x => `${x.k} — ${x.v} requests`),
        mitre: ['T1090.004 Domain Fronting', 'T1584 Compromise Infrastructure'],
        action: 'Enforce SNI↔Host equality at the ADC and reject the mismatch. This pattern is used for domain fronting, virtual-host confusion, and routing past per-host policy.',
        query: `sni != host`
      }));
    }
  }

  /* ---- D13 user-agent anomalies ---- */
  {
    let noUA = 0; const noUAsrc = new Map();
    const uaBySrc = profs.filter(p => p.uUA >= 5 && p.cnt >= 20 && p.uUA / p.cnt > .15);
    forEachScope(i => { if (!C.ua.val(C.ua.codes[i])) { noUA++; noUAsrc.set(C.src.codes[i], (noUAsrc.get(C.src.codes[i]) || 0) + 1); } });
    if (noUA >= 20) F.push(mkFinding({
      det: 'D13', title: `${noUA.toLocaleString()} requests with no User-Agent`,
      category: 'Client fingerprint anomaly', score: sc(30 + Math.log10(1 + noUA) * 12), confidence: .85,
      from: idx.tmin, to: idx.tmax,
      metrics: { requests: noUA, sources: noUAsrc.size, share: +(noUA / total).toFixed(4) },
      entities: { ips: topN(noUAsrc, 10, c => C.src.val(c)).map(x => x.k) },
      evidence: ['Browsers always send a User-Agent. Absence means raw sockets, a stripped proxy, or a deliberately minimal client.'],
      action: 'Challenge or block empty-UA traffic unless a known internal health checker or monitoring probe is responsible.',
      query: `ua = ""`
    }));
    if (uaBySrc.length) F.push(mkFinding({
      det: 'D13b', title: `${uaBySrc.length} source(s) rotating User-Agent strings`,
      category: 'Evasion', score: 58, confidence: .75,
      from: idx.tmin, to: idx.tmax,
      metrics: { sources: uaBySrc.length, maxUAs: Math.max(...uaBySrc.map(p => p.uUA)) },
      entities: { ips: uaBySrc.slice(0, 15).map(p => p.ip) },
      evidence: uaBySrc.slice(0, 5).map(p => `${p.ip} — ${p.uUA} distinct UAs across ${p.cnt} requests (${(p.uUA / p.cnt * 100).toFixed(0)}% churn)`),
      mitre: ['T1036 Masquerading'],
      action: 'UA rotation from one IP is a deliberate evasion of UA-based rules. Pin the policy to the TLS/JA3 fingerprint and behaviour instead of the UA string.',
      query: `src in ("${uaBySrc.slice(0, 8).map(p => p.ip).join('", "')}")`
    }));
  }

  /* ---- D14 beaconing / metronomic automation ---- */
  {
    const beacons = profs.filter(p => !p.allow && p.cnt >= cfg.beaconMin && p.gapCV > 0 && p.gapCV <= cfg.beaconCV && p.gapMean >= 200 && p.modeShare >= .35 && !p.crawler)
      .sort((a, b) => (b.modeShare - b.gapCV) - (a.modeShare - a.gapCV));
    for (const p of beacons.slice(0, 20)) {
      F.push(mkFinding({
        det: 'D14', title: `Metronomic client — ${p.ip} requests every ${(p.gapMean / 1000).toFixed(1)}s (CV ${p.gapCV.toFixed(3)})`,
        category: 'Automation / C2-like', score: sc(40 + (1 - p.gapCV) * 35 + p.modeShare * 20), confidence: .7,
        from: p.first, to: p.last,
        metrics: { intervalMs: Math.round(p.gapMean), jitterCV: +p.gapCV.toFixed(4), modeShare: +p.modeShare.toFixed(3), requests: p.cnt, uniquePaths: p.uPaths },
        entities: { ips: [p.ip] },
        evidence: [
          `Inter-arrival jitter is ${(p.gapCV * 100).toFixed(1)}% — humans and browsers are far noisier than this.`,
          `${(p.modeShare * 100).toFixed(0)}% of gaps land in a single 100 ms bucket.`,
          p.uPaths <= 3 ? `Hits only ${p.uPaths} path(s) — consistent with a poller, health check, or beacon.` : `Spread across ${p.uPaths} paths.`
        ],
        mitre: ['T1071.001 Web Protocols', 'T1029 Scheduled Transfer'],
        action: 'Identify the client: a legitimate monitor, a scraper, or a beacon. If it is not on your allow-list of pollers, treat regular cadence to a single endpoint as an implant until proven otherwise.',
        query: `src = "${p.ip}"`
      }));
    }
  }

  /* ---- D16 egress / exfiltration anomaly ---- */
  {
    const outs = [];
    forEachScope(i => { if (C.bout.a[i] > 0) outs.push(C.bout.a[i]); });
    if (outs.length > 50) {
      const so = Float64Array.from(outs).sort();
      const p50 = pct(so, .5), p999 = pct(so, .999);
      const heavy = profs.filter(p => !p.allow && p.bout > 0).map(p => ({ p, avg: p.bout / p.cnt }))
        .filter(x => x.p.bout > p999 * 20 || (x.avg > p50 * 50 && x.p.cnt >= 10))
        .sort((a, b) => b.p.bout - a.p.bout).slice(0, 12);
      for (const { p, avg } of heavy) {
        const ratio = p.bin > 0 ? p.bout / p.bin : Infinity;
        F.push(mkFinding({
          det: 'D16', title: `Egress anomaly — ${p.ip} pulled ${(p.bout / 1e6).toFixed(1)} MB (${(avg / 1024).toFixed(0)} KB/request)`,
          category: 'Data exposure', score: sc(35 + Math.log10(1 + p.bout / 1e6) * 20 + (p.uPaths <= 3 ? 15 : 0)), confidence: .6,
          from: p.first, to: p.last,
          metrics: { egressBytes: p.bout, requests: p.cnt, avgBytes: Math.round(avg), medianBytesFleet: Math.round(p50), outInRatio: isFinite(ratio) ? +ratio.toFixed(1) : null, uniquePaths: p.uPaths },
          entities: { ips: [p.ip] },
          evidence: [
            `Per-response size is ${(avg / Math.max(1, p50)).toFixed(0)}× the fleet median.`,
            p.uPaths <= 3 ? `Concentrated on ${p.uPaths} endpoint(s) — looks like bulk export or an unpaginated API.` : `Spread over ${p.uPaths} endpoints.`,
            `Response:request byte ratio ${isFinite(ratio) ? ratio.toFixed(0) + ':1' : 'n/a'}.`
          ],
          mitre: ['T1030 Data Transfer Size Limits', 'T1567 Exfiltration Over Web Service'],
          action: 'Check whether the endpoint enforces pagination and per-token record limits. If this is an API key, rate-limit by identity, not by IP.',
          query: `src = "${p.ip}" and bout > ${Math.round(p50 * 20)}`
        }));
      }
    }
  }

  /* ---- D17 cache-buster / query churn ---- */
  {
    const perPath = new Map();
    forEachScope(i => {
      const pc = C.path.codes[i]; if (!perPath.has(pc)) perPath.set(pc, { n: 0, q: new Set(), src: new Set() });
      const o = perPath.get(pc); o.n++; if (o.q.size < 200000) o.q.add(C.query.codes[i]); o.src.add(C.src.codes[i]);
    });
    const churn = Array.from(perPath.entries()).filter(([pc, o]) => o.n >= 200 && o.q.size / o.n > .85 && o.q.size > 150)
      .sort((a, b) => b[1].n - a[1].n).slice(0, 6);
    for (const [pc, o] of churn) {
      F.push(mkFinding({
        det: 'D17', title: `Cache-buster pattern on ${C.path.val(pc)} — ${o.q.size.toLocaleString()} unique query strings`,
        category: 'Availability / cache abuse', score: sc(40 + Math.log10(1 + o.n) * 12), confidence: .72,
        from: idx.tmin, to: idx.tmax,
        metrics: { requests: o.n, uniqueQueries: o.q.size, uniquenessRatio: +(o.q.size / o.n).toFixed(3), sources: o.src.size },
        entities: { paths: [C.path.val(pc)], ips: [] },
        evidence: [`${(o.q.size / o.n * 100).toFixed(0)}% of requests carry a never-before-seen query string — every one is a guaranteed cache miss that lands on the origin.`],
        mitre: ['T1499.002 Service Exhaustion Flood'],
        action: 'Normalise the cache key: ignore unknown query parameters at the ADC, or allow-list the parameters that actually vary the response.',
        query: `path = "${C.path.val(pc)}"`
      }));
    }
  }

  /* ---- D18 rare / dangerous methods ---- */
  {
    const mCount = new Map(); const bySrc = new Map();
    forEachScope(i => {
      const m = C.method.val(C.method.codes[i]); if (!m) return;
      mCount.set(m, (mCount.get(m) || 0) + 1);
      if (/^(PUT|DELETE|TRACE|TRACK|CONNECT|PROPFIND|MKCOL|MOVE|COPY|SEARCH|DEBUG|PATCH)$/.test(m)) {
        const k = C.src.codes[i]; if (!bySrc.has(k)) bySrc.set(k, new Map());
        bySrc.get(k).set(m, (bySrc.get(k).get(m) || 0) + 1);
      }
    });
    const dangerous = ['TRACE', 'TRACK', 'CONNECT', 'PROPFIND', 'MKCOL', 'MOVE', 'COPY', 'DEBUG', 'PUT', 'DELETE'].filter(m => mCount.get(m));
    if (dangerous.length) {
      const n = dangerous.reduce((a, m) => a + mCount.get(m), 0);
      F.push(mkFinding({
        det: 'D18', title: `Uncommon HTTP methods observed: ${dangerous.join(', ')}`,
        category: 'Protocol abuse', score: sc(35 + dangerous.length * 8 + Math.log10(1 + n) * 8), confidence: .85,
        from: idx.tmin, to: idx.tmax,
        metrics: Object.fromEntries(dangerous.map(m => [m, mCount.get(m)])),
        entities: { ips: Array.from(bySrc.keys()).slice(0, 12).map(c => C.src.val(c)) },
        evidence: [
          `Method mix: ${topN(mCount, 8).map(x => x.k + ' ' + x.v).join(', ')}`,
          dangerous.includes('TRACE') || dangerous.includes('TRACK') ? 'TRACE/TRACK enable Cross-Site Tracing — they should return 405 at the edge.' : '',
          dangerous.includes('PROPFIND') || dangerous.includes('MKCOL') ? 'WebDAV verbs suggest the origin exposes an authoring interface.' : ''
        ].filter(Boolean),
        mitre: ['T1595 Active Scanning', 'T1190 Exploit Public-Facing Application'],
        action: 'Restrict the allowed method set per content class at the ADC; anything outside GET/POST/HEAD/OPTIONS (plus the API verbs you actually use) should be rejected before the origin.',
        query: `method in ("${dangerous.join('", "')}")`
      }));
    }
  }

  /* ---- D19 geographic shift ---- */
  {
    const half = idx.tmin + (idx.tmax - idx.tmin) / 2;
    const a = new Map(), b = new Map(); let na = 0, nb = 0;
    forEachScope(i => {
      const c = C.country.val(C.country.codes[i]); if (!c) return;
      if (C.ts.a[i] < half) { a.set(c, (a.get(c) || 0) + 1); na++; } else { b.set(c, (b.get(c) || 0) + 1); nb++; }
    });
    if (na > 200 && nb > 200) {
      const shifts = [];
      for (const [c, v] of b) {
        const pa = (a.get(c) || 0) / na, pb = v / nb;
        if (pb > .02 && (pa === 0 ? pb > .03 : pb / pa > 4)) shifts.push({ c, pa, pb, mult: pa ? pb / pa : Infinity, n: v });
      }
      shifts.sort((x, y) => y.n - x.n);
      if (shifts.length) F.push(mkFinding({
        det: 'D19', title: `Geographic shift — ${shifts.slice(0, 3).map(x => x.c).join(', ')} surged in the second half of the capture`,
        category: 'Behaviour change', score: sc(30 + shifts.length * 6 + shifts[0].pb * 80), confidence: .6,
        from: half, to: idx.tmax,
        metrics: { countriesShifted: shifts.length, topShare: +shifts[0].pb.toFixed(3) },
        entities: { countries: shifts.slice(0, 8).map(x => x.c) },
        evidence: shifts.slice(0, 5).map(x => `${x.c}: ${(x.pa * 100).toFixed(2)}% → ${(x.pb * 100).toFixed(2)}% (${isFinite(x.mult) ? x.mult.toFixed(1) + '×' : 'new'}), ${x.n} requests`),
        action: 'Compare against your customer geography. A sudden origin shift with no marketing or release event behind it is usually a proxy pool or a botnet coming online.',
        query: `country in ("${shifts.slice(0, 5).map(x => x.c).join('", "')}") and ts>=${Math.floor(half)}`
      }));
    }
  }

  /* ---- D20 DNA cohorts (botnet fingerprints) ---- */
  {
    for (const c of dna.clusters.filter(c => c.size >= cfg.dnaMinCohort && c.risk >= 45 && c.requests / c.size >= 3).slice(0, 8)) {
      F.push(mkFinding({
        det: 'D20', title: `Traffic DNA cohort ${c.id} — ${c.size} sources sharing one behavioural profile (${c.label})`,
        category: 'Coordinated activity', score: sc(c.risk), confidence: .68,
        from: Math.min(...c.members.map(m => m.first)), to: Math.max(...c.members.map(m => m.last)),
        metrics: { sources: c.size, requests: c.requests, countries: c.spread, distinctFingerprints: c.fps.length, avgRps: +(c.members.reduce((a, m) => a + m.rate, 0) / c.size).toFixed(2) },
        entities: { ips: c.members.slice(0, 25).map(m => m.ip), countries: c.countries.slice(0, 10) },
        evidence: [
          `Profile: ${c.label}.`,
          `${c.size} distinct IPs across ${c.spread} countries behave within ${(cfg.dnaEps * 100).toFixed(0)}% of one another on all 16 behavioural dimensions.`,
          c.fps.length <= 3 ? `They also share only ${c.fps.length} client fingerprint(s) — same tooling, different addresses.` : `${c.fps.length} client fingerprints in the cohort.`,
          `User agents: ${c.uas.join(' | ').slice(0, 160)}`
        ],
        mitre: ['T1583.005 Botnet', 'T1498 Network DoS'],
        action: 'Treat the cohort as one actor: build the mitigation around the shared fingerprint and behaviour, not the individual IPs, because the addresses will rotate and the DNA will not.',
        query: `src in ("${c.members.slice(0, 12).map(m => m.ip).join('", "')}")`
      }));
    }
    for (const f of (dna.fpCohorts || []).filter(f => f.suspicious && f.size >= Math.max(8, cfg.dnaMinCohort) && f.countries.length >= 3).slice(0, 5)) {
      F.push(mkFinding({
        det: 'D20b', title: `Identical client fingerprint ${f.fp} across ${f.size} IPs in ${f.countries.length} countries`,
        category: 'Coordinated activity', score: sc(50 + Math.log10(1 + f.size) * 20 + f.countries.length * 2), confidence: .8,
        from: idx.tmin, to: idx.tmax,
        metrics: { sources: f.size, requests: f.requests, countries: f.countries.length },
        entities: { ips: f.ips.slice(0, 25), countries: f.countries.slice(0, 10) },
        evidence: [`Risk signals: ${f.reasons.join('; ')}.`, `Fingerprint components — ${f.raw.slice(0, 200)}`, `${f.perSource.toFixed(0)} requests per source, ${(f.errRate * 100).toFixed(0)}% errors, ${f.pathsAvg.toFixed(1)} paths each.`, `Geographically dispersed IPs producing byte-identical client characteristics is the clearest botnet/proxy-pool tell in the dataset.`],
        mitre: ['T1583.005 Botnet'],
        action: 'Write the block/challenge rule against this fingerprint. It survives IP rotation.',
        query: `ua = "${(f.ua || '').replace(/"/g, '')}"`
      }));
    }
  }

  /* ---- D21 sub-threshold coordination (rate-limit evasion) ---- */
  {
    const pathSrc = new Map();
    forEachScope(i => {
      const pc = C.path.codes[i];
      if (!pathSrc.has(pc)) pathSrc.set(pc, new Map());
      const m = pathSrc.get(pc); m.set(C.src.codes[i], (m.get(C.src.codes[i]) || 0) + 1);
    });
    const evade = [];
    for (const [pc, m] of pathSrc) {
      if (m.size < 30) continue;
      const counts = Array.from(m.values());
      const mx = Math.max(...counts), md = median(counts), tot = counts.reduce((a, b) => a + b, 0);
      if (tot >= 500 && mx <= 12 && md <= 4 && m.size >= 40) evade.push({ pc, srcs: m.size, tot, mx, md });
    }
    evade.sort((a, b) => b.tot - a.tot);
    for (const e of evade.slice(0, 4)) {
      F.push(mkFinding({
        det: 'D21', title: `Sub-threshold coordination on ${C.path.val(e.pc)} — ${e.srcs} sources, none above ${e.mx} requests`,
        category: 'Evasion', score: sc(50 + Math.log10(1 + e.tot) * 12), confidence: .65,
        from: idx.tmin, to: idx.tmax,
        metrics: { sources: e.srcs, requests: e.tot, maxPerSource: e.mx, medianPerSource: e.md },
        entities: { paths: [C.path.val(e.pc)] },
        evidence: [
          `Aggregate volume is high (${e.tot}) while every individual source stays trivially small (max ${e.mx}, median ${e.md}).`,
          'Per-IP rate limiting cannot see this. Only the aggregate view can.'
        ],
        mitre: ['T1498 Network DoS', 'T1027 Obfuscation'],
        action: 'Rate-limit at the endpoint/aggregate level (requests per second per URI, not per source) and add a challenge for first-seen sources hitting this path.',
        query: `path = "${C.path.val(e.pc)}"`
      }));
    }
  }

  /* ---- D22 policy efficacy: attacks that were NOT blocked ---- */
  {
    let attacks = 0, blocked = 0, allowed200 = 0; const leaked = new Map();
    forEachScope(i => {
      const p = C.path.val(C.path.codes[i]), q = C.query.val(C.query.codes[i]);
      const target = p + (q ? '?' + q : '');
      let hit = null;
      for (let z = 0; z < SIG.length; z++) if (SIG[z][1].test(target)) { hit = SIG[z][0]; break; }
      if (!hit) return;
      attacks++;
      const oc = C.outcome.val(C.outcome.codes[i]) + ' ' + C.action.val(C.action.codes[i]) + ' ' + C.appresp.val(C.appresp.codes[i]);
      if (/block|deny|drop|reject|mitigat|challenge/i.test(oc)) { blocked++; return; }
      if (C.statusn.a[i] >= 200 && C.statusn.a[i] < 400) { allowed200++; leaked.set(hit + ' → ' + p, (leaked.get(hit + ' → ' + p) || 0) + 1); }
    });
    if (attacks > 0) {
      const eff = blocked / attacks;
      F.push(mkFinding({
        det: 'D22', title: `WAF efficacy — ${blocked.toLocaleString()} of ${attacks.toLocaleString()} attack-signature requests were enforced (${(eff * 100).toFixed(1)}%)`,
        category: 'Control effectiveness', score: Math.max(allowed200 > 0 ? 60 : 12, sc((1 - eff) * 90 + (allowed200 > 0 ? 45 : 0))), confidence: .7,
        from: idx.tmin, to: idx.tmax,
        metrics: { attackRequests: attacks, blocked, allowedWith2xx3xx: allowed200, efficacy: +eff.toFixed(3) },
        evidence: [
          allowed200 > 0 ? `⚠ ${allowed200} requests carrying attack payloads received a 2xx/3xx from the origin.` : 'No attack-signature request reached the origin successfully.',
          ...topN(leaked, 5).map(x => `${x.k} — ${x.v} successful responses`)
        ],
        mitre: ['T1190 Exploit Public-Facing Application'],
        action: allowed200 > 0
          ? 'Move the relevant AppWall signature groups from Passive to Active for this policy, then re-test. Every payload that returned 2xx needs an application-side check for actual impact.'
          : 'Policy is enforcing. Keep the passive/active split under review as new content classes are added.',
        query: `outcome !~ "block"`
      }));
    }
  }

  /* ---- D23 content-type / status mismatch (error page storms) ---- */
  {
    const mism = new Map();
    forEachScope(i => {
      const p = C.path.val(C.path.codes[i]), ct = C.ctype.val(C.ctype.codes[i]), st = C.statusn.a[i];
      if (!ct) return;
      if (RE_STATIC.test(p) && /text\/html/.test(ct) && st >= 200 && st < 300) mism.set(p, (mism.get(p) || 0) + 1);
    });
    const top = topN(mism, 6);
    let n = 0; for (const v of mism.values()) n += v;
    if (n >= 50) F.push(mkFinding({
      det: 'D23', title: `${n.toLocaleString()} static assets returned HTML with a 200 status`,
      category: 'Origin misbehaviour', score: 44, confidence: .8,
      from: idx.tmin, to: idx.tmax,
      metrics: { requests: n, paths: mism.size },
      entities: { paths: top.map(x => x.k) },
      evidence: [...top.map(x => `${x.k} — ${x.v} responses typed text/html`), 'A JS/CSS/image URL answering with HTML and a 200 is usually a soft-404 or an SPA catch-all route. Monitoring will show this as healthy while users see a broken page.'],
      action: 'Fix the origin routing so missing assets return a real 404, or the ADC will keep caching error pages under asset URLs.',
      query: `ctype ~ "text/html"`
    }));
  }

  /* ---- D24 time-based blind injection ---- */
  {
    const susp = new Map();
    forEachScope(i => {
      const q = C.query.val(C.query.codes[i]); if (!q) return;
      if (!/(sleep\s*\(|benchmark\s*\(|pg_sleep|waitfor\s+delay|%20sleep|dbms_pipe)/i.test(q)) return;
      const k = C.src.val(C.src.codes[i]) + '|' + C.path.val(C.path.codes[i]);
      if (!susp.has(k)) susp.set(k, { n: 0, e2e: 0 });
      const o = susp.get(k); o.n++; o.e2e += C.e2e.a[i] || C.srtt.a[i];
    });
    for (const [k, o] of Array.from(susp.entries()).sort((a, b) => b[1].n - a[1].n).slice(0, 5)) {
      const [ip, path] = k.split('|');
      F.push(mkFinding({
        det: 'D24', title: `Time-based blind injection probe — ${ip} on ${path}`,
        category: 'Exploitation attempt', score: 82, confidence: .85,
        from: idx.tmin, to: idx.tmax,
        metrics: { probes: o.n, avgResponseMs: Math.round(o.e2e / o.n) },
        entities: { ips: [ip], paths: [path] },
        evidence: [
          `${o.n} requests contain a deliberate delay primitive (SLEEP/BENCHMARK/WAITFOR).`,
          o.e2e / o.n > 2000 ? `⚠ Average response time ${(o.e2e / o.n / 1000).toFixed(1)}s — the delay appears to be executing, which means the injection is live.` : `Average response ${Math.round(o.e2e / o.n)} ms — the delay does not appear to execute.`
        ],
        mitre: ['T1190 Exploit Public-Facing Application'],
        action: 'Escalate immediately if response times track the requested delay. Parameterise the query at the origin; a WAF rule is containment, not a fix.',
        query: `src = "${ip}" and query ~ "sleep"`
      }));
    }
  }
  /* ---- D25 subnet infrastructure clustering ---- */
  {
    const bySub = new Map();
    for (const p of profs) {
      const q = p.ip.split('.'); if (q.length !== 4) continue;
      const k = q[0] + '.' + q[1] + '.' + q[2] + '.0/24';
      if (!bySub.has(k)) bySub.set(k, []);
      bySub.get(k).push(p);
    }
    const out = [];
    for (const [net, ms] of bySub) {
      if (ms.length < 8) continue;
      const req = ms.reduce((a, b) => a + b.cnt, 0);
      if (req < 200) continue;
      const err = ms.reduce((a, b) => a + b.c4 + b.c5, 0) / req;
      const fps = new Set(ms.map(m => m.fp || '?'));
      const auto = ms.filter(m => m.auto || m.tool || !m.ua).length / ms.length;
      const firsts = ms.map(m => m.first).filter(Boolean).sort((a, b) => a - b);
      const onset = firsts.length > 1 ? firsts[firsts.length - 1] - firsts[0] : 0;
      const sync = firsts.length > 4 && onset < 180000;
      const tight = fps.size <= Math.max(2, Math.ceil(ms.length * .15));
      const reasons = [];
      if (tight) reasons.push(`${fps.size} client fingerprint${fps.size === 1 ? '' : 's'} across ${ms.length} addresses`);
      if (sync) reasons.push(`all addresses first seen within ${Math.round(onset / 1000)}s of each other`);
      if (auto > .5) reasons.push(`${(auto * 100).toFixed(0)}% automation clients`);
      if (err > .25) reasons.push(`${(err * 100).toFixed(0)}% error rate`);
      if (!reasons.length) continue;
      out.push({ net, ms, req, err, fps: fps.size, auto, onset, sync, reasons,
        raw: 20 + ms.length * .6 + Math.log10(1 + req) * 14 + (tight ? 22 : 0) + (sync ? 20 : 0) + auto * 18 + err * 30 });
    }
    out.sort((a, b) => b.raw - a.raw);
    for (const o of out.slice(0, 6)) {
      F.push(mkFinding({
        det: 'D25', title: `Single netblock acting as one actor — ${o.net}, ${o.ms.length} addresses`,
        category: 'Coordinated activity', score: sc(o.raw), confidence: .75,
        from: Math.min(...o.ms.map(m => m.first || Infinity)), to: Math.max(...o.ms.map(m => m.last || 0)),
        metrics: { netblock: o.net, addresses: o.ms.length, requests: o.req, fingerprints: o.fps,
          errorRate: +o.err.toFixed(3), automationShare: +o.auto.toFixed(2), onsetSpreadSec: Math.round(o.onset / 1000) },
        entities: { ips: o.ms.slice(0, 25).map(m => m.ip), countries: Array.from(new Set(o.ms.map(m => m.country).filter(Boolean))).slice(0, 6) },
        evidence: [
          `Risk signals: ${o.reasons.join('; ')}.`,
          `Addresses inside one /24 rarely belong to unrelated users — this is one tenant, one host, or one rented range.`,
          `Blocking the /24 removes ${fmtN2(o.req)} requests; blocking the ${o.ms.length} addresses individually invites rotation within the same range.`
        ],
        mitre: ['T1583.003 Virtual Private Server', 'T1583.005 Botnet'],
        action: `Consider a netblock-level control for ${o.net} rather than per-address rules. Confirm the range is not a carrier NAT or CDN egress pool before enforcing.`,
        query: `src ~ "${o.net.replace('.0/24', '.')}"`
      }));
    }
  }
  return F;
}
function fmtN2(n) { return n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'k' : String(n); }

/* =====================================================================
   CAMPAIGN CORRELATION
   One actor produces many findings. Chaining them by shared entity and
   overlapping time turns a wall of alarms into a small number of stories
   with a kill-chain ordering.
   ===================================================================== */
const PHASE = {
  'Reconnaissance': [1, 'Reconnaissance'], 'Client fingerprint anomaly': [1, 'Reconnaissance'],
  'Behaviour change': [1, 'Reconnaissance'], 'Coordinated activity': [2, 'Staging'],
  'Evasion': [2, 'Staging'], 'Protocol abuse': [2, 'Staging'],
  'Exploitation attempt': [3, 'Exploitation'], 'Credential access': [3, 'Exploitation'],
  'Availability / DDoS': [4, 'Impact'], 'Availability': [4, 'Impact'],
  'Availability / resource exhaustion': [4, 'Impact'], 'Availability / cache abuse': [4, 'Impact'],
  'Backend health': [4, 'Impact'], 'Data exposure': [5, 'Exfiltration'],
  'Origin misbehaviour': [0, 'Hygiene'], 'Control effectiveness': [0, 'Hygiene'],
  'Cryptographic posture': [0, 'Hygiene']
};
const sub24 = ip => { const q = String(ip).split('.'); return q.length === 4 ? q[0] + '.' + q[1] + '.' + q[2] : null; };
function buildCampaigns(F) {
  const n = F.length, parent = new Array(n);
  for (let i = 0; i < n; i++) parent[i] = i;
  const find = x => { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; };
  const uni = (a, b) => { a = find(a); b = find(b); if (a !== b) parent[b] = a; };
  const overlap = (a, b) => a.from <= b.to + 60000 && b.from <= a.to + 60000;

  /* A single shared address is NOT enough to link two findings. A 404 storm and
     a botnet cohort can both happen to contain one common IP, and transitive
     union-find then welds unrelated incidents into one bogus campaign. Require
     the smaller entity set to be substantially contained in the larger. */
  const ipSets = F.map(f => new Set((f.entities.ips || []).slice(0, 80)));
  const subSets = F.map(f => new Set((f.entities.ips || []).slice(0, 80).map(sub24).filter(Boolean)));
  const pathSets = F.map(f => new Set((f.entities.paths || []).filter(p => p && p !== '/')));
  const contain = (A, B) => {
    if (!A.size || !B.size) return 0;
    const small = A.size <= B.size ? A : B, big = A.size <= B.size ? B : A;
    let hit = 0; for (const x of small) if (big.has(x)) hit++;
    return hit / small.size;
  };
  for (let a = 0; a < n; a++) for (let b = a + 1; b < n; b++) {
    const A = ipSets[a], B = ipSets[b];
    const narrow = A.size > 0 && B.size > 0 && A.size <= 8 && B.size <= 8;
    const ipOverlap = contain(A, B);
    let link = false;
    if (narrow && ipOverlap > 0) link = true;                       // two focused findings, same actor
    else if (ipOverlap >= .5) link = true;                          // one is a subset of the other
    else if (contain(subSets[a], subSets[b]) >= .6 && overlap(F[a], F[b])) link = true;  // same infrastructure, same window
    else if (pathSets[a].size && pathSets[a].size <= 6 && pathSets[b].size <= 6 &&
             contain(pathSets[a], pathSets[b]) >= .5 && overlap(F[a], F[b])) link = true; // same narrow target, same window
    if (link) uni(a, b);
  }
  const groups = new Map();
  F.forEach((f, i) => { const r = find(i); if (!groups.has(r)) groups.set(r, []); groups.get(r).push(f); });

  const camps = [];
  for (const members of groups.values()) {
    if (members.length < 2) continue;
    members.sort((a, b) => (PHASE[a.category] ? PHASE[a.category][0] : 9) - (PHASE[b.category] ? PHASE[b.category][0] : 9) || a.from - b.from);
    const ipCount = new Map();
    members.forEach(m => (m.entities.ips || []).forEach(ip => ipCount.set(ip, (ipCount.get(ip) || 0) + 1)));
    const actors = Array.from(ipCount.entries()).sort((a, b) => b[1] - a[1]).map(x => x[0]);
    const targets = Array.from(new Set(members.flatMap(m => (m.entities.paths || []))));
    const phases = Array.from(new Set(members.map(m => PHASE[m.category] ? PHASE[m.category][1] : 'Other')));
    const top = members.slice().sort((a, b) => b.score - a.score)[0];
    const from = Math.min(...members.map(m => m.from)), to = Math.max(...members.map(m => m.to));
    const topHits = actors.length ? ipCount.get(actors[0]) : 0;
    const dominant = actors.length && topHits >= Math.max(2, members.length * .6);
    // Addresses appearing in only one detection are incidental to a chain that
    // is really about one actor — count them, but do not call them the actor.
    const principals = dominant ? actors.filter(a => ipCount.get(a) >= 2) : actors;
    const incidental = actors.length - principals.length;
    const mins = Math.max(1, Math.round((to - from) / 60000));
    const score = Math.min(99, top.score + Math.min(12, (phases.length - 1) * 5));
    camps.push({
      severity: sevOf(score), score, phases, from, to, dominant, incidental,
      title: dominant
        ? `Attack chain from ${actors[0]} — ${phases.join(' → ')}`
        : `Coordinated campaign — ${actors.length} sources, ${phases.join(' → ')}`,
      narrative: dominant
        ? `${actors[0]} appears in ${topHits} of these ${members.length} detections across ${mins} minute${mins === 1 ? '' : 's'}, moving through ${phases.join(' then ')}. Treat it as one incident, not ${members.length}.${incidental > 0 ? ` ${incidental} further address${incidental === 1 ? '' : 'es'} appear once each and are probably incidental to the same windows.` : ''}`
        : `${actors.length} sources produced ${members.length} correlated detections against ${targets.length || 'several'} target${targets.length === 1 ? '' : 's'} over ${mins} minute${mins === 1 ? '' : 's'}. The shared infrastructure and timing make a single operator far more likely than coincidence.`,
      actors: principals.slice(0, 30), allActors: actors.length, targets: targets.slice(0, 12),
      findings: members.map(m => m.id), members,
      query: dominant ? `src = "${actors[0]}"` : (actors.length ? `src in (${actors.slice(0, 12).map(a => '"' + a + '"').join(', ')})` : null)
    });
  }
  camps.sort((a, b) => b.score - a.score || b.members.length - a.members.length);
  camps.forEach((c, i) => { c.id = 'C' + String(i + 1).padStart(2, '0'); c.members.forEach(m => m.campaign = c.id); });
  return camps;
}

function analyze() {
  const t0 = now();
  const F = runDetectors().concat(runDetectors2()).concat(sessionFindings());
  F.forEach((f, i) => { f.id = 'F' + String(i + 1).padStart(3, '0'); });
  F.sort((a, b) => b.score - a.score || b.confidence - a.confidence);
  E.findings = F.filter(f => f.confidence >= E.cfg.minConfidence);
  E.campaigns = buildCampaigns(E.findings);
  return {
    findings: E.findings,
    campaigns: E.campaigns.map(c => ({ id: c.id, title: c.title, narrative: c.narrative, severity: c.severity,
      score: c.score, phases: c.phases, from: c.from, to: c.to, actors: c.actors, targets: c.targets,
      allActors: c.allActors, incidental: c.incidental, dominant: c.dominant,
      findings: c.findings, query: c.query,
      stages: c.members.map(m => ({ id: m.id, det: m.det, title: m.title, category: m.category,
        phase: PHASE[m.category] ? PHASE[m.category][1] : 'Other', severity: m.severity, score: m.score, from: m.from })) })),
    ms: Math.round(now() - t0)
  };
}

/* ------------------------------ summary ------------------------------ */
function summary() {
  const s = E.store, C = s.cols, idx = E.idx;
  let c2 = 0, c3 = 0, c4 = 0, c5 = 0, bout = 0, bin = 0, srtt = 0, srttN = 0, e2e = 0, e2eN = 0;
  const lat = [];
  forEachScope(i => {
    const st = C.statusn.a[i];
    if (st >= 500) c5++; else if (st >= 400) c4++; else if (st >= 300) c3++; else if (st >= 200) c2++;
    bout += C.bout.a[i]; bin += C.bin.a[i];
    if (C.srtt.a[i] > 0) { srtt += C.srtt.a[i]; srttN++; if (lat.length < 300000) lat.push(C.srtt.a[i]); }
    if (C.e2e.a[i] > 0) { e2e += C.e2e.a[i]; e2eN++; }
  });
  const ls = Float64Array.from(lat).sort();
  const n = selCount(), span = Math.max(1, (idx.tmax - idx.tmin) / 1000);
  return {
    rows: n, totalRows: s.n, truncated: s.truncated, skipped: s.skipped,
    tmin: idx.tmin, tmax: idx.tmax, spanSec: span, avgRps: n / span,
    peakRps: (() => { let m = 0; const a = E.idx.rps; for (let i = 0; i < a.length; i++) if (a[i] > m) m = a[i]; return m / E.idx.secScale; })(),
    c2, c3, c4, c5, errRate: (c4 + c5) / Math.max(1, n), avail: 1 - c5 / Math.max(1, n),
    bytesOut: bout, bytesIn: bin,
    srttAvg: srttN ? srtt / srttN : 0, srttP50: pct(ls, .5), srttP95: pct(ls, .95), srttP99: pct(ls, .99),
    e2eAvg: e2eN ? e2e / e2eN : 0,
    fill: s.fill || {}, syntheticTime: !!s.syntheticTime, overrides: E.overrides,
    units: E.units || [], anomalies: E.anomalies || null, badSamples: s.badSamples || [], tzOffsetMin: E.tzOffsetMin,
    duplicateGroups: (() => {
      const m = new Map(), out = [];
      for (const f of s.files) { if (!f.sig || !f.rows) continue; const k = f.sig + ':' + f.rows;
        if (!m.has(k)) m.set(k, []); m.get(k).push(f.name); }
      for (const [, names] of m) if (names.length > 1) out.push(names);
      return out;
    })(),
    overlapPairs: (() => {
      const out = [];
      for (let a = 0; a < s.files.length; a++) for (let b = a + 1; b < s.files.length; b++) {
        const x = s.files[a], y = s.files[b];
        if (!x.rows || !y.rows || !x.lastTs || !y.lastTs) continue;
        if (x.firstTs <= y.lastTs && y.firstTs <= x.lastTs) out.push([x.name, y.name]);
      }
      return out.slice(0, 12);
    })(),
    extraFields: Array.from(s.extras.keys()),
    cardinality: Object.fromEntries(Object.keys(C).filter(k => C[k] instanceof Dict).map(k => [k, C[k].card - 1])),
    files: s.files, noTs: idx.noTs
  };
}


/* =====================================================================
   SESSION LAYER  —  the missing hierarchy between actor and request.
   A request is not a unit of behaviour. A session is. Sessionising by
   (source, agent) with an idle gap makes funnel skipping, entry-point
   analysis and per-visit velocity expressible, none of which can be
   stated at request level.
   ===================================================================== */
E.sessions = null;
const SESSION_IDLE = 1800000;   // 30 min
function buildSessions() {
  const s = E.store, C = s.cols, idx = E.idx, mask = scopeMask();
  const out = [], cap = 400000;
  for (let sc = 1; sc < C.src.card && out.length < cap; sc++) {
    const a = idx.srcOff[sc], b = idx.srcOff[sc + 1];
    if (b - a === 0) continue;
    let cur = null;
    for (let k = a; k < b; k++) {
      const i = idx.srcRows[k];
      if (mask && !mask[i]) continue;
      const t = C.ts.a[i], ua = C.ua.codes[i];
      if (!cur || t - cur.end > SESSION_IDLE || ua !== cur.uaCode) {
        if (cur) out.push(cur);
        if (out.length >= cap) break;
        cur = { src: C.src.val(sc), sc, uaCode: ua, ua: C.ua.val(ua), start: t, end: t, n: 0,
          rows: [], paths: [], entry: '', exit: '', c2: 0, c3: 0, c4: 0, c5: 0, auth: 0, authOk: 0,
          bin: 0, bout: 0, e2e: 0, noRef: 0, country: C.country.val(C.country.codes[i]), uPaths: new Set(),
          methods: new Set(), sig: 0 };
      }
      cur.end = t; cur.n++;
      if (cur.rows.length < 400) cur.rows.push(i);
      const p = C.path.val(C.path.codes[i]);
      if (cur.paths.length < 400) cur.paths.push(p);
      if (!cur.entry) cur.entry = p;
      cur.exit = p;
      cur.uPaths.add(C.path.codes[i]); cur.methods.add(C.method.val(C.method.codes[i]));
      const st = C.statusn.a[i];
      if (st >= 500) cur.c5++; else if (st >= 400) cur.c4++; else if (st >= 300) cur.c3++; else if (st >= 200) cur.c2++;
      if (RE_AUTH.test(p)) { cur.auth++; if (st >= 200 && st < 400) cur.authOk++; }
      if (!C.referer.val(C.referer.codes[i])) cur.noRef++;
      cur.bin += C.bin.a[i]; cur.bout += C.bout.a[i]; cur.e2e += C.e2e.a[i];
      const q = C.query.val(C.query.codes[i]);
      if (cur.sig < 50) { const tgt = p + (q ? '?' + q : ''); for (let z = 0; z < SIG.length; z++) if (SIG[z][1].test(tgt)) { cur.sig++; break; } }
    }
    if (cur) out.push(cur);
  }
  for (const x of out) {
    x.dur = Math.max(0, x.end - x.start);
    x.rps = x.dur > 0 ? x.n / (x.dur / 1000) : x.n;
    x.unique = x.uPaths.size;
    x.depth = x.n;
    x.methodList = Array.from(x.methods);
    delete x.uPaths; delete x.methods;
  }
  out.sort((p, q) => q.n - p.n);
  E.sessions = out;
  return out;
}

/* Business-logic funnel: a real buyer arrives at a product or listing before a
   cart, and a cart before a checkout. Sessions that appear at the end of the
   funnel with nothing in front of them are automation, price scraping, or
   card testing — invisible at request level because each request is a valid 200. */
const FUNNEL = [
  [/\/(product|item|catalog|listing|search|category|shop)/i, 1],
  [/\/(cart|basket|bag)/i, 2],
  [/\/(checkout|payment|pay|order|purchase|billing)/i, 3]
];
function funnelStage(p) { for (const [re, s] of FUNNEL) if (re.test(p)) return s; return 0; }
function sessionFindings() {
  const F = [], sess = E.sessions || buildSessions();
  if (!sess.length) return F;
  const skips = [], fast = [], takeovers = [];
  for (const x of sess) {
    let maxSeen = 0, skipped = false;
    for (const p of x.paths) {
      const st = funnelStage(p);
      if (st === 0) continue;
      if (st > maxSeen + 1) skipped = true;
      if (st > maxSeen) maxSeen = st;
    }
    if (skipped && maxSeen >= 2) skips.push(x);
    if (x.n >= 30 && x.rps > 6 && x.unique >= 10) fast.push(x);
    if (x.auth >= 8 && x.authOk > 0 && (x.auth - x.authOk) >= 5) takeovers.push(x);
  }
  const mk = (det, list, title, cat, ev, act, mitre, conf, raw) => {
    if (!list.length) return;
    const n = list.reduce((a, b) => a + b.n, 0);
    F.push(mkFinding({
      det, title: title(list, n), category: cat, score: sc(raw(list, n)), confidence: conf,
      from: Math.min.apply(null, list.map(x => x.start)), to: Math.max.apply(null, list.map(x => x.end)),
      metrics: { sessions: list.length, requests: n, sources: new Set(list.map(x => x.src)).size,
        medianRequestsPerSession: Math.round(median(list.map(x => x.n))) },
      entities: { ips: Array.from(new Set(list.map(x => x.src))).slice(0, 20),
        paths: Array.from(new Set(list.flatMap(x => [x.entry, x.exit]))).slice(0, 10) },
      evidence: ev(list, n), mitre, action: act,
      query: `src in ("${Array.from(new Set(list.map(x => x.src))).slice(0, 12).join('", "')}")`
    }));
  };
  mk('D26', skips.slice(0, 400),
    (l) => `Funnel skipping — ${l.length} session${l.length === 1 ? '' : 's'} reached checkout without the steps before it`,
    'Business logic abuse',
    (l) => [
      `${l.length} sessions hit a cart or checkout path with no preceding product or listing view in the same visit.`,
      `Entry points used: ${Array.from(new Set(l.map(x => x.entry))).slice(0, 5).join(', ')}.`,
      `Every individual request here returns a normal status — this is only visible once requests are grouped into visits.`,
      `Typical shapes: card testing, price scraping, inventory hoarding, or a direct-to-endpoint integration nobody documented.`
    ],
    'Confirm whether a legitimate integration posts straight to checkout. If not, enforce funnel state server-side rather than relying on the UI, and rate-limit checkout by identity.',
    ['T1190 Exploit Public-Facing Application'], .6,
    (l, n) => 25 + Math.log10(1 + l.length) * 22 + Math.log10(1 + n) * 8);
  mk('D27', fast.slice(0, 300),
    (l) => `Non-human session velocity — ${l.length} visit${l.length === 1 ? '' : 's'} above ${Math.round(Math.min.apply(null, l.map(x => x.rps)))} req/s sustained`,
    'Automation',
    (l) => [
      `Median ${Math.round(median(l.map(x => x.rps)))} requests/second within a single visit across ${Math.round(median(l.map(x => x.unique)))} distinct pages.`,
      `A person reading pages produces well under one request per second between page loads; this is a crawler or a scripted client.`,
      `Agents: ${Array.from(new Set(l.map(x => x.ua || '∅'))).slice(0, 3).map(u => u.slice(0, 48)).join(' | ')}`
    ],
    'Score these as bot traffic. If it is a partner integration, move it to an API key with its own quota so it stops competing with human traffic for capacity.',
    ['T1595 Active Scanning'], .7,
    (l, n) => 20 + Math.log10(1 + l.length) * 20 + Math.log10(1 + n) * 8);
  mk('D28', takeovers.slice(0, 100),
    (l) => `Possible account takeover — ${l.length} session${l.length === 1 ? '' : 's'} succeeded at authentication after repeated failures`,
    'Credential access',
    (l) => [
      `Each of these visits shows ${Math.round(median(l.map(x => x.auth - x.authOk)))} failed authentications followed by a success, inside one session.`,
      `A user who forgot a password usually fails once or twice. A run of failures ending in a success is the signature of a guessed credential.`,
      `Sources: ${Array.from(new Set(l.map(x => x.src))).slice(0, 6).join(', ')}`
    ],
    'Treat the successful accounts as compromised until proven otherwise: force reset, invalidate sessions, and check what those sessions did after the success.',
    ['T1110 Brute Force', 'T1078 Valid Accounts'], .75,
    (l) => 55 + Math.log10(1 + l.length) * 25);
  return F;
}

/* =====================================================================
   ENTITY DOSSIER — everything the capture knows about one noun.
   ===================================================================== */
function entityDossier(kind, value, opts) {
  const s = E.store, C = s.cols, idx = E.idx, mask = scopeMask();
  opts = opts || {};
  let rows = [];
  if (kind === 'src') {
    const code = C.src.map.get(value);
    if (code === undefined) return { kind, value, missing: true };
    for (let k = idx.srcOff[code]; k < idx.srcOff[code + 1]; k++) { const i = idx.srcRows[k]; if (!mask || mask[i]) rows.push(i); }
  } else if (kind === 'path') {
    const code = C.path.map.get(value);
    if (code === undefined) return { kind, value, missing: true };
    for (let k = idx.pathOff[code]; k < idx.pathOff[code + 1]; k++) { const i = idx.pathRows[k]; if (!mask || mask[i]) rows.push(i); }
  } else if (kind === 'subnet') {
    const pre = value.replace(/\.0\/24$/, '.');
    for (let c = 1; c < C.src.card; c++) if (C.src.val(c).indexOf(pre) === 0)
      for (let k = idx.srcOff[c]; k < idx.srcOff[c + 1]; k++) { const i = idx.srcRows[k]; if (!mask || mask[i]) rows.push(i); }
    rows.sort((a, b) => C.ts.a[a] - C.ts.a[b]);
  } else {
    const col = C[kind]; if (!col || !(col instanceof Dict)) return { kind, value, missing: true };
    const code = col.map.get(value);
    if (code === undefined) return { kind, value, missing: true };
    const n = s.n;
    for (let k = 0; k < n; k++) { const i = idx.at(k); if (col.codes[i] === code && (!mask || mask[i])) rows.push(i); }
  }
  if (!rows.length) return { kind, value, missing: true };

  const tally = f => { const m = new Map(); for (const i of rows) { const c = C[f].codes[i]; m.set(c, (m.get(c) || 0) + 1); } return topN(m, 12, c => C[f].val(c) || '(empty)').map(x => ({ value: x.k, count: x.v, pct: x.v / rows.length })); };
  let c2 = 0, c3 = 0, c4 = 0, c5 = 0, bin = 0, bout = 0, srtt = 0, srttN = 0, e2e = 0, sig = 0;
  const sigKinds = new Set(), lat = [];
  for (const i of rows) {
    const st = C.statusn.a[i];
    if (st >= 500) c5++; else if (st >= 400) c4++; else if (st >= 300) c3++; else if (st >= 200) c2++;
    bin += C.bin.a[i]; bout += C.bout.a[i]; e2e += C.e2e.a[i];
    if (C.srtt.a[i] > 0) { srtt += C.srtt.a[i]; srttN++; if (lat.length < 60000) lat.push(C.srtt.a[i]); }
    if (sig < 5000) {
      const t = C.path.val(C.path.codes[i]) + (C.query.val(C.query.codes[i]) ? '?' + C.query.val(C.query.codes[i]) : '');
      for (let z = 0; z < SIG.length; z++) if (SIG[z][1].test(t)) { sig++; sigKinds.add(SIG[z][0]); break; }
    }
  }
  const ls = Float64Array.from(lat).sort();
  const first = C.ts.a[rows[0]], last = C.ts.a[rows[rows.length - 1]];
  // activity sparkline over the whole capture window
  const B = 120, span = Math.max(1, idx.tmax - idx.tmin), spark = new Array(B).fill(0);
  for (const i of rows) spark[clamp(Math.floor((C.ts.a[i] - idx.tmin) / span * B), 0, B - 1)]++;

  const prof = kind === 'src' ? (E.profiles || []).find(p => p.ip === value) : null;
  const out = {
    kind, value, requests: rows.length, first, last,
    status: { c2, c3, c4, c5 }, bytesIn: bin, bytesOut: bout,
    srttAvg: srttN ? srtt / srttN : 0, srttP95: pct(ls, .95), e2eAvg: e2e / rows.length,
    sig, sigKinds: Array.from(sigKinds), spark, sparkT0: idx.tmin, sparkT1: idx.tmax,
    top: { path: tally('path'), src: tally('src'), status: tally('status'), ua: tally('ua'),
      country: tally('country'), method: tally('method'), serverid: tally('serverid'),
      ctype: tally('ctype'), host: tally('host'), tls: tally('tls') },
    findings: (E.findings || []).filter(f =>
      (f.entities.ips || []).indexOf(value) >= 0 || (f.entities.paths || []).indexOf(value) >= 0 ||
      (f.entities.servers || []).indexOf(value) >= 0 || (f.metrics && f.metrics.netblock === value))
      .map(f => ({ id: f.id, det: f.det, title: f.title, severity: f.severity, score: f.score, campaign: f.campaign })),
    profile: prof ? { rate: prof.rate, max1: prof.max1, uPaths: prof.uPaths, uUA: prof.uUA, gapCV: prof.gapCV,
      modeShare: prof.modeShare, pEnt: prof.pEnt, fp: prof.fp, fpRaw: prof.fpRaw, dna: prof.dna ? Array.from(prof.dna) : null,
      tool: prof.tool, auto: prof.auto, crawler: prof.crawler, blocked: prof.blocked } : null,
    query: kind === 'subnet' ? `src ~ "${value.replace('.0/24', '.')}"` : `${kind} = "${value}"`
  };
  // neighbours: who else shares this actor's fingerprint or netblock
  if (kind === 'src' && prof && prof.fp) {
    const sub = sub24(value);
    out.neighbours = {
      fingerprint: (E.profiles || []).filter(p => p.fp === prof.fp && p.ip !== value)
        .slice(0, 25).map(p => ({ ip: p.ip, cnt: p.cnt, country: p.country })),
      subnet: sub ? (E.profiles || []).filter(p => p.ip !== value && sub24(p.ip) === sub)

/* full original record for one row, mapped fields plus everything the aliases
   did not recognise */
function fullRecord(i) {
  const s = E.store, C = s.cols, o = { __i: i, __fields: {}, __extra: {} };
  for (const k in C) { const col = C[k]; o.__fields[k] = col instanceof Dict ? col.val(col.codes[i]) : col.a[i]; }
  for (const [name, col] of s.extras) { const v = col.val(col.codes[i]); if (v !== '') o.__extra[name] = v; }
  return o;
}

/* =====================================================================
   CROSS-TAB — any field by any field, with a choice of measure.
   ===================================================================== */
function crosstab(fa, fb, measure, limitA, limitB) {
  const s = E.store, C = s.cols;
  const A = C[fa], B = C[fb];
  if (!A || !B || !(A instanceof Dict) || !(B instanceof Dict)) return { error: 'both axes must be categorical fields' };
  // Error rate against a status axis is degenerate: every cell contains one
  // status, so the answer is always 0% or 100% and tells you nothing.
  if (measure === 'errorRate' && (fa === 'status' || fb === 'status'))
    return { error: 'Error rate cannot be measured against the status axis — each cell would hold a single status code. Pick a different axis, or switch the measure to request count.' };

  eachSel(i => { ca[A.codes[i]]++; cb[B.codes[i]]++; });

    const arr = []; for (let c = 0; c < counts.length; c++) if (counts[c] > 0) arr.push(c);
    arr.sort((x, y) => counts[y] - counts[x]);

  const isRate = measure === 'errorRate';
  const isMean = /^(srtt|crtt|e2e|xfer)$/.test(measure);
  const num = (!isRate && measure !== 'requests') ? C[measure] : null;
  eachSel(i => {
    const x = ia.get(A.codes[i]), y = ib.get(B.codes[i]);
    if (x === undefined || y === undefined) return;
    const k = x * rb.length + y;
    if (isRate) { wts[k]++; if (C.statusn.a[i] >= 400) cells[k]++; }
    else if (num) { cells[k] += num.a[i]; wts[k]++; }
    else cells[k]++;
  });
  if (isRate || isMean) for (let k = 0; k < cells.length; k++) cells[k] = wts[k] ? cells[k] / wts[k] : 0;
  return {
    rowsField: fa, colsField: fb, measure,
    rows: ra.map(c => ({ label: A.val(c) || '(empty)', total: ca[c] })),
    cols: rb.map(c => ({ label: B.val(c) || '(empty)', total: cb[c] })),
    cells: Array.from(cells)
  };
}

/* ------------------------------ messaging ------------------------------ */
const reply = (id, ok, data, err) => self.postMessage({ id, ok, data, err: err ? String(err && err.message || err) : null });

self.onmessage = async (ev) => {

      case 'config': {

      }

      case 'crosstab': reply(id, true, crosstab(args.a, args.b, args.measure, args.limitA, args.limitB)); break;
      case 'sessions': {

          dur: v.dur, n: v.n, unique: v.unique, rps: v.rps, entry: v.entry, exit: v.exit,
          c2: v.c2, c4: v.c4, c5: v.c5, auth: v.auth, authOk: v.authOk, bout: v.bout, sig: v.sig,

      case 'summary': reply(id, true, summary()); break;
      case 'analyze': reply(id, true, analyze()); break;
      case 'top': reply(id, true, topValues(args.field, args.k || 20, true)); break;
      case 'tops': { const o = {}; for (const f of args.fields) o[f] = topValues(f, args.k || 12, true); reply(id, true, o); break; }
      case 'series': reply(id, true, timeSeries(args.buckets, true)); break;
      case 'heatmap': reply(id, true, heatmap(true)); break;
      case 'page': reply(id, true, page(args.offset || 0, args.limit || 100, args.sortField, args.sortDir, args.fields)); break;
      case 'profiles': {
        const p = (E.profiles || buildProfiles());

        reply(id, true, p.slice(0, args.limit || 500).map(x => ({
          ip: x.ip, cnt: x.cnt, rate: x.rate, max1: x.max1, uPaths: x.uPaths, uUA: x.uUA, country: x.country,
          c2: x.c2, c4: x.c4, c5: x.c5, c404: x.c404, c401: x.c401 + x.c403, auth: x.auth, sig: x.sigHits, sigKinds: x.sigKinds,
          bout: x.bout, bin: x.bin, e2e: x.cnt ? x.e2e / x.cnt : 0, srtt: x.cnt ? x.srtt / x.cnt : 0,
          gapCV: x.gapCV, gapMean: x.gapMean, pEnt: x.pEnt, ua: x.ua, tls: x.tls, cipher: x.cipher, httpv: x.httpv,
          tool: x.tool, auto: x.auto, crawler: x.crawler, blocked: x.blocked, first: x.first, last: x.last,
          fp: x.fp, dna: x.dna ? Array.from(x.dna) : null, depth: x.depth

      }
      case 'dna': {
        const d = E.dna || buildDNA();
        reply(id, true, {
          dims: DNA_DIMS,
          clusters: d.clusters.slice(0, 40).map(c => ({
            id: c.id, size: c.size, requests: c.requests, label: c.label, risk: c.risk,
            countries: c.countries.slice(0, 8), fps: c.fps.slice(0, 5), uas: c.uas,
            centroid: Array.from(c.centroid),
            members: c.members.slice(0, 40).map(m => ({ ip: m.ip, cnt: m.cnt, country: m.country, fp: m.fp, dna: Array.from(m.dna), ua: m.ua }))
          })),

      }
      case 'schema': {
        const C = E.store.cols, o = [];
        for (const k in C) o.push({ field: k, kind: C[k] instanceof Dict ? 'dict' : 'num', cardinality: C[k] instanceof Dict ? C[k].card - 1 : null });
        reply(id, true, { fields: o, files: E.store.files });

      case 'values': { const col = E.store.cols[args.field]; reply(id, true, col instanceof Dict ? col.vals.slice(1, 400) : []); break; }
      default: reply(id, false, null, 'unknown command ' + cmd);
    }
  } catch (e) { reply(id, false, null, (e && e.stack) || e); }
};

<script>
/* =====================================================================

const fmtDur = s => { s = Math.max(0, Math.round(s)); const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60); return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : m ? `${m}m ${s % 60}s` : s + 's'; };
const fmtTs = t => { const d = new Date(t); return isNaN(d) ? '—' : d.toISOString().slice(0, 19).replace('T', ' '); };
const pctS = v => (v * 100).toFixed(v < .01 ? 2 : 1) + '%';

/* ------------------------------ worker ------------------------------ */
const engineSrc = document.getElementById('engine-src').textContent;

/* ------------------------------- state ------------------------------- */
const S = { sum: null, findings: [], campaigns: [], files: [], profiles: [], dna: null, series: null, q: '', range: null, tab: 'overview',
  tops: {}, loaded: false, expRows: [], explorerPage: 0, explorerSort: null, explorerDir: 'asc' };

const TABS = [
  ['campaigns', 'Campaigns', 'F1'], ['overview', 'Overview', 'F2'], ['detections', 'Detections', 'F3'], ['dna', 'Traffic DNA', 'F4'],
  ['sources', 'Sources', 'F5'], ['endpoints', 'Endpoints', 'F6'], ['client', 'TLS &amp; client', 'F7'],
  ['pivot', 'Pivot', 'F8'], ['explorer', 'Explorer', 'F9'], ['export', 'Export &amp; tuning', 'F10']

function buildNav() {

    if (id === 'campaigns') { const badge = el('span', 'badge', '0'); badge.id = 'campcount'; b.appendChild(badge); badge.style.display = 'none'; }

function go(id) {

function busy(on, msg) {

  $('#fEng').textContent = msg || (on ? 'working…' : 'engine idle');
}
function onProgress(d) {

  busy(true, `parsing ${d.file} — ${fmtN(d.rows)} rows`);

/* ------------------------------ canvas ------------------------------ */
function fitCanvas(c, h) {
  const dpr = window.devicePixelRatio || 1, w = c.clientWidth || c.parentElement.clientWidth || 800;
  c.width = Math.max(1, Math.round(w * dpr)); c.height = Math.round(h * dpr); c.style.height = h + 'px';
  const x = c.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, w, h);
  return { x, w, h };
}
const CSSV = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* stacked-area traffic scope with a latency overlay and drag-to-select */
function drawTimeline(canvas, s, opts) {
  opts = opts || {};
  const H = opts.height || 190, pad = { l: 52, r: 50, t: 12, b: 22 };
  const { x, w } = fitCanvas(canvas, H);
  const iw = w - pad.l - pad.r, ih = H - pad.t - pad.b;
  const B = s.B, stack = [s.c2, s.c3, s.c4, s.c5];
  const cols = [CSSV('--mint'), CSSV('--trace'), CSSV('--amber'), CSSV('--coral')];
  let max = 0; for (let i = 0; i < B; i++) max = Math.max(max, s.total[i]);
  max = max || 1;
  const bw = iw / B;
  const X = i => pad.l + i * bw, Y = v => pad.t + ih - (v / max) * ih;

  x.strokeStyle = '#1b2733'; x.lineWidth = 1; x.font = '10px ui-monospace,monospace'; x.fillStyle = CSSV('--muted');

    const y = pad.t + ih - (g / 4) * ih;
    x.beginPath(); x.moveTo(pad.l, y + .5); x.lineTo(pad.l + iw, y + .5); x.stroke();
    x.textAlign = 'right'; x.fillText(fmtN(max * g / 4), pad.l - 7, y + 3);
  }

  const acc = new Float64Array(B);
  for (let k = 0; k < 4; k++) {
    x.beginPath(); x.moveTo(pad.l, pad.t + ih);
    for (let i = 0; i < B; i++) { acc[i] += stack[k][i]; x.lineTo(X(i) + bw / 2, Y(acc[i])); }
    x.lineTo(pad.l + iw, pad.t + ih); x.closePath();
    x.fillStyle = cols[k] + (k === 0 ? '30' : k === 3 ? '90' : '60'); x.fill();
    x.beginPath();
    for (let i = 0; i < B; i++) { const px = X(i) + bw / 2, py = Y(acc[i]); i ? x.lineTo(px, py) : x.moveTo(px, py); }
    x.strokeStyle = cols[k]; x.lineWidth = k === 3 ? 1.4 : 1; x.globalAlpha = .95; x.stroke(); x.globalAlpha = 1;
  }

    x.fillStyle = CSSV('--violet'); x.textAlign = 'left';

  }

  x.fillStyle = CSSV('--muted'); x.textAlign = 'center';

/* ------------------------------ facets ------------------------------ */
function facetPanel(title, field, items, opts) {
  opts = opts || {};

function findingCard(f) {

const PIVOT_FIELDS = ['status', 'country', 'method', 'serverid', 'host', 'path', 'src', 'ua', 'tls', 'cipher',
  'httpv', 'ctype', 'cclass', 'outcome', 'sev', 'sni', 'dport', 'file'];
const MEASURES = [['requests', 'request count'], ['errorRate', '4xx+5xx rate'], ['bout', 'bytes out (total)'],
  ['srtt', 'backend RTT (mean ms)'], ['e2e', 'end-to-end (mean ms)']];
async function renderPivot(v) {
  const st = S.pivot || (S.pivot = { a: 'serverid', b: 'status', m: 'requests' });
  v.innerHTML = `<div class="panel"><h3>Cross-tab<small>any field against any field · click a cell to filter to it</small></h3>
    <div class="body">
      <div class="ctl">
        <span class="lbl">Rows</span><select id="pvA">${PIVOT_FIELDS.map(f => `<option${f === st.a ? ' selected' : ''}>${f}</option>`).join('')}</select>
        <span class="lbl">Columns</span><select id="pvB">${PIVOT_FIELDS.map(f => `<option${f === st.b ? ' selected' : ''}>${f}</option>`).join('')}</select>
        <span class="lbl">Measure</span><select id="pvM">${MEASURES.map(([k, l]) => `<option value="${k}"${k === st.m ? ' selected' : ''}>${l}</option>`).join('')}</select>
        <button class="btn" id="pvSwap">Swap axes</button>
      </div>
      <div class="hint" id="pvNote" style="color:var(--amber);margin-bottom:8px"></div>
      <div id="pvGrid" class="pivot"><p class="hint" style="padding:11px">Computing…</p></div>
      <p class="hint" style="margin:10px 0 0">Cell shading is relative to the largest value in the table. This is where you find the thing you did not know to look for — backend member against status code, country against content class, agent against error rate.</p>
    </div></div>`;
  const draw = async () => {
    st.a = $('#pvA').value; st.b = $('#pvB').value; st.m = $('#pvM').value;
    let note = '';
    if (st.m === 'errorRate' && (st.a === 'status' || st.b === 'status')) {
      if (st.a === 'status') { st.a = 'path'; $('#pvA').value = 'path'; } else { st.b = 'path'; $('#pvB').value = 'path'; }
      note = 'Error rate against the status axis would put one status code in every cell, so that axis was switched to endpoint.';
    }
    $('#pvGrid').innerHTML = '<p class="hint" style="padding:11px">Computing…</p>';
    const r = await rpc('crosstab', { a: st.a, b: st.b, measure: st.m, limitA: 18, limitB: 14 });
    if (r.error) { $('#pvGrid').innerHTML = `<p class="hint" style="padding:11px">${esc(r.error)}</p>`; return; }
    if (note) $('#pvNote').textContent = note; else $('#pvNote').textContent = '';
    let max = 0; for (const c of r.cells) max = Math.max(max, c);
    const fmtCell = x => st.m === 'errorRate' ? (x ? (x * 100).toFixed(1) + '%' : '·')
      : st.m === 'bout' ? (x ? fmtB(x) : '·') : /rtt|e2e/.test(st.m) ? (x ? Math.round(x) : '·') : (x ? fmtN(x) : '·');
    $('#pvGrid').innerHTML = `<table><thead><tr><th>${esc(st.a)} \ ${esc(st.b)}</th>
      ${r.cols.map(c => `<th class="r" title="${esc(c.label)}">${esc(String(c.label).slice(0, 16))}</th>`).join('')}<th class="r">total</th></tr></thead><tbody>
      ${r.rows.map((row, i) => `<tr><td class="rh" title="${esc(row.label)}" data-ek="${esc(st.a)}" data-ev="${esc(row.label)}">${esc(String(row.label).slice(0, 34))}</td>
        ${r.cols.map((col, j) => { const x = r.cells[i * r.cols.length + j], t = max ? x / max : 0;
          return `<td data-a="${esc(row.label)}" data-b="${esc(col.label)}" style="background:${t > 0 ? `hsla(${192 - t * 172},${40 + t * 45}%,${11 + t * 30}%,1)` : 'transparent'}">${fmtCell(x)}</td>`; }).join('')}
        <td class="r" style="color:var(--muted)">${fmtN(row.total)}</td></tr>`).join('')}
      </tbody></table>`;
    $$('#pvGrid td[data-a]').forEach(td => td.onclick = () => {
      $('#q').value = `${st.a} = "${td.dataset.a}" and ${st.b} = "${td.dataset.b}"`; S.range = null; applyQuery().then(() => go('explorer'));
    });
    $$('#pvGrid td.rh').forEach(td => td.onclick = ev => { ev.stopPropagation(); openEntity(td.dataset.ek, td.dataset.ev); });
  };
  ['pvA', 'pvB', 'pvM'].forEach(id => $('#' + id).onchange = draw);
  $('#pvSwap').onclick = () => { const t = $('#pvA').value; $('#pvA').value = $('#pvB').value; $('#pvB').value = t; draw(); };
  await draw();
}

async function loadExplorer() {
