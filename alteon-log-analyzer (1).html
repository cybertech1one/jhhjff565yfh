    let val = row[f];
    if (f === 'ts') val = fmtTs(val);
    else if (f === 'bout' || f === 'bin') val = fmtB(val);
    else if (f === 'srtt' || f === 'e2e') val = val ? Math.round(val) + 'ms' : '·';
    else if (f === 'status') return `<td class="${cls(val)}">${esc(val)}</td>`;
    return `<td title="${esc(row[f])}">${esc(val === '' || val == null ? '·' : val)}</td>`;
  }).join('')}</tr>`).join(''));
  $$('#expT tbody tr').forEach(tr => { if (tr.dataset.bound) return; tr.dataset.bound = '1';
    tr.onclick = async () => { const rec = await rpc('record', { i: +tr.dataset.i }); showRecord(rec); }; });
  $('#expCount').textContent = `showing ${Math.min(S.explorerPage * 250, r.total)} of ${fmtN(r.total)} matching requests`;
  $('#expMore').disabled = S.explorerPage * 250 >= r.total;
  $('#expInfo').textContent = S.q || S.range ? 'filtered view' : 'all requests';
}

const MAP_FIELDS = [['ts', 'timestamp'], ['src', 'source IP'], ['host', 'host header'], ['path', 'URL path'],
  ['query', 'query string'], ['method', 'HTTP method'], ['status', 'response code'], ['ua', 'user agent'],

  ['httpv', 'HTTP version'], ['server', 'backend address'], ['serverid', 'backend id'], ['ctype', 'content type'],
  ['cclass', 'content class'], ['outcome', 'policy outcome'], ['sev', 'event severity'], ['action', 'action / attack'],
  ['bin', 'request bytes'], ['bout', 'response bytes'], ['srtt', 'server RTT'], ['crtt', 'client RTT'],
  ['e2e', 'end-to-end time'], ['xfer', 'transfer time']];
const CRITICAL_FIELDS = ['ts', 'src', 'path', 'status'];
function allHeaders() {
  return Array.from(new Set((S.sum.files || []).flatMap(f => f.headers || []))).sort();
}
function unitsPanel() {
  const u = S.sum.units || [];
  if (!u.length) return '';
  const scaled = u.filter(x => x.scaled);
  return `<div class="lbl" style="margin-top:14px">Time units</div>
    <p class="hint" style="margin:4px 0 6px">Nothing in a log states whether a latency column is seconds, milliseconds or microseconds. Read as the wrong one, every latency threshold is off by a factor of a thousand and no error is ever raised — so the unit is inferred from the distribution and shown here.</p>
    ${scaled.length ? `<div class="warn-banner" style="margin-bottom:7px"><b>Rescaled ${scaled.map(x => x.field + ' in ' + (x.file || '')).join(', ')}</b> — values looked like ${scaled[0].detected === 's' ? 'seconds' : 'microseconds'} and were converted to milliseconds. If that is wrong, force the unit below and re-ingest.</div>` : ''}
    ${u.map(x => `<div class="maprow"><span class="cf">${x.field}<div class="hint" style="font-size:10px">${esc(x.file || '')}</div></span>
      <span class="hint">detected <b style="color:${x.scaled ? 'var(--amber)' : 'var(--mint)'}">${esc(x.detected)}</b> (${x.source}) · p50 ${Math.round(x.p50)} ms · p99 ${Math.round(x.p99)} ms · ${(x.fractionalShare * 100).toFixed(0)}% fractional</span>
      <span></span></div>`).join('')}`;
}
function anomalyPanel() {
  const a = S.sum.anomalies, b = S.sum.badSamples || [];
  if (!a) return '';
  const rows = [['badStatus', 'status codes outside 100–599'], ['negBytes', 'negative byte counts'],
    ['badTs', 'timestamps outside a plausible range'], ['hugeLat', 'latencies over an hour'],
    ['emptyPath', 'rows with no path']].filter(([k]) => a[k] > 0);
  if (!rows.length && !b.length) return `<div class="lbl" style="margin-top:14px">Value validation</div>
    <p class="hint" style="margin:4px 0 0">No impossible values and no unparseable lines. ${fmtN(a.rows)} rows checked.</p>`;
  return `<div class="lbl" style="margin-top:14px">Value validation</div>
    <p class="hint" style="margin:4px 0 6px">Values that parsed but cannot be true. These are reported, never silently corrected — a field full of impossible values usually means the column is mapped to the wrong thing.</p>
    ${rows.map(([k, label]) => `<div class="maprow"><span class="cf">${fmtN(a[k])}</span>
      <span class="hint">${label} (${pctS(a[k] / Math.max(1, a.rows))} of rows)</span><span></span></div>`).join('')}
    ${b.length ? `<div class="lbl" style="margin-top:11px">Unparseable lines — first ${b.length}</div>
      ${b.map(x => `<div class="hint" style="font-family:var(--mono);font-size:10.5px;padding:3px 0;border-bottom:1px solid #16202a"><b style="color:var(--muted)">${esc(x.file)}</b> ${esc(x.line)}</div>`).join('')}` : ''}`;
}
function mappingWarnings() {
  const fill = S.sum.fill || {}, w = [];
  if (S.sum.syntheticTime) w.push('No column parsed as a timestamp, so an even 1 Hz timeline was synthesised. Rate and window detectors still run, but the times shown are not real — map a timestamp field below.');
  CRITICAL_FIELDS.forEach(f => { if (!S.sum.syntheticTime || f !== 'ts') { if ((fill[f] || 0) < .5) w.push(`<b>${f}</b> is populated on only ${pctS(fill[f] || 0)} of rows. Detectors that depend on it will under-report.`); } });
  if (!w.length) return '';
  return `<div class="warn-banner"><b>Mapping needs attention</b><ul style="margin:6px 0 0;padding-left:17px">${w.map(x => `<li>${x}</li>`).join('')}</ul></div>`;
}
function buildMapRows() {
  const heads = allHeaders(), fill = S.sum.fill || {};
  const from = {}; (S.sum.files || []).forEach(f => Object.assign(from, f.mapping || {}));
  $('#maprows').innerHTML = MAP_FIELDS.map(([k, label]) => {
    const cur = (S.overrides || {})[k] || from[k] || '';
    const pc = fill[k] || 0;
    const col = pc === 0 ? 'var(--coral)' : pc < .5 ? 'var(--amber)' : 'var(--mint)';
    return `<div class="maprow">
      <span class="cf">${k}<div class="hint" style="font-size:10px">${esc(label)}</div></span>
      <select data-k="${k}"><option value="">— not mapped —</option>
        ${heads.map(h => `<option value="${esc(h)}"${h === cur ? ' selected' : ''}>${esc(h)}</option>`).join('')}</select>
      <span class="fillbar"><span class="bar" style="width:44px"><i style="width:${(pc * 100).toFixed(0)}%;background:${col}"></i></span><span>${(pc * 100).toFixed(0)}%</span></span>
    </div>`;
  }).join('');
  $('#mapNote').textContent = heads.length ? '' : 'This format has no positional header row; overrides match on key name.';
  $('#mapApply').onclick = async () => {
    const ov = {};
    $$('#maprows select').forEach(s => { if (s.value) ov[s.dataset.k] = s.value; });
    S.overrides = ov;
    if (!S.files.length) { showErr('Re-ingest needs the original files. Load them again to apply a mapping.'); return; }
    await ingest(S.files);
  };
  $('#mapReset').onclick = async () => { S.overrides = {}; if (S.files.length) await ingest(S.files); };
}

function dl(name, text, mime) {
  const b = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
  const a = el('a'); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
const stamp = () => new Date().toISOString().slice(0, 19).replace(/[:T]/g, '');
function allIps() {
  const set = new Set();
  for (const f of S.findings) if (f.severity === 'critical' || f.severity === 'high')
    for (const i of (f.entities.ips || [])) set.add(i);
  return Array.from(set);
}
async function doExport(kind) {
  busy(true, 'building export');
  try {
    if (kind === 'json') dl(`alteon-findings-${stamp()}.json`, JSON.stringify({
      generated: new Date().toISOString(), filter: S.q || null, timeRange: S.range,
      capture: S.sum.files, summary: S.sum, config: S.cfg, findings: S.findings
    }, null, 2), 'application/json');
    else if (kind === 'csv') {
      const head = ['id', 'detector', 'severity', 'score', 'confidence', 'category', 'title', 'from', 'to', 'sources', 'paths', 'mitre', 'recommendation'];
      const q = s => '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"';
      const rows = S.findings.map(f => [f.id, f.det, f.severity, f.score, f.confidence.toFixed(2), f.category, f.title,
        fmtTs(f.from), fmtTs(f.to), (f.entities.ips || []).join(' '), (f.entities.paths || []).join(' '), (f.mitre || []).join('; '), f.action].map(q).join(','));
      dl(`alteon-findings-${stamp()}.csv`, head.join(',') + '\n' + rows.join('\n'), 'text/csv');
    }
    else if (kind === 'ioc') dl(`alteon-ioc-${stamp()}.txt`, allIps().join('\n'), 'text/plain');
    else if (kind === 'acl') {
      const ips = allIps();
      const lines = ['! Alteon ADC — candidate block list',
        '! Generated ' + new Date().toISOString() + ' from ' + (S.sum.files || []).map(f => f.name).join(', '),
        '! REVIEW BEFORE APPLYING. Check for shared NAT / CDN egress in the finding entity lists.', ''];
      ips.forEach((ip, i) => {
        lines.push(`/cfg/slb/filt ${900 + i}`, `\tename "auto-block-${i + 1}"`, `\tsip ${ip}`, `\tsmask 255.255.255.255`,
          `\tdip any`, `\tproto tcp`, `\taction deny`, `\tena`, '');
      });
      lines.push('! Plain list for cloud WAF / DefensePro import:', ...ips);
      dl(`alteon-blocklist-${stamp()}.cfg`, lines.join('\n'));
    }
    else if (kind === 'rows') {
      const r = await rpc('page', { offset: 0, limit: 200000, fields: EXP_FIELDS });
      const q = s => '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"';
      const body = r.rows.map(row => EXP_FIELDS.map(f => q(f === 'ts' ? fmtTs(row[f]) : row[f])).join(',')).join('\n');
      dl(`alteon-requests-${stamp()}.csv`, EXP_FIELDS.join(',') + '\n' + body, 'text/csv');
    }
    else if (kind === 'brief') dl(`alteon-incident-brief-${stamp()}.md`, buildBrief(), 'text/markdown');
  } catch (e) { showErr(e.message); }
  busy(false);
}
function buildBrief() {
  const s = S.sum, sev = {};
  S.findings.forEach(f => sev[f.severity] = (sev[f.severity] || 0) + 1);
  const L = [];
  L.push('# Alteon traffic analysis — incident brief', '');
  L.push(`**Capture** ${(s.files || []).map(f => f.name).join(', ')}`);
  L.push(`**Window** ${fmtTs(s.tmin)} → ${fmtTs(s.tmax)} (${fmtDur(s.spanSec)})`);
  L.push(`**Volume** ${nf.format(s.rows)} requests · avg ${s.avgRps.toFixed(1)} rps · peak ${Math.round(s.peakRps)} rps`);
  if (S.q) L.push(`**Filter applied** \`${S.q}\``);
  L.push('', '## Service health', '',
    `| Metric | Value |`, `|---|---|`,
    `| Availability (non-5xx) | ${(s.avail * 100).toFixed(3)}% |`,
    `| Error rate | ${pctS(s.errRate)} (${nf.format(s.c4)} 4xx, ${nf.format(s.c5)} 5xx) |`,
    `| Backend RTT p50 / p95 / p99 | ${fmtMs(s.srttP50)} / ${fmtMs(s.srttP95)} / ${fmtMs(s.srttP99)} |`,
    `| Egress | ${fmtB(s.bytesOut)} |`,
    `| Unique sources / endpoints / agents | ${nf.format(s.cardinality.src)} / ${nf.format(s.cardinality.path)} / ${nf.format(s.cardinality.ua)} |`);
  if (S.campaigns.length) {
    L.push('', '## Campaigns', '',
      `${S.campaigns.length} correlated campaign${S.campaigns.length === 1 ? '' : 's'}. Findings sharing a source address, a /24, or a specific target within overlapping time are treated as one actor.`, '');
    for (const c of S.campaigns) {
      L.push(`### ${c.id} · ${c.severity.toUpperCase()} (${c.score}) — ${c.title}`, '', c.narrative, '',
        '| Phase | Detector | Detection | Score | Time |', '|---|---|---|---|---|');
      c.stages.forEach(st => L.push(`| ${st.phase} | ${st.det} | ${st.title.replace(/\|/g, '/')} | ${st.score} | ${fmtTs(st.from).slice(11)} |`));
      if (c.actors.length) L.push('', `**Sources:** ${c.actors.slice(0, 25).join(', ')}`);
      if (c.targets.length) L.push(`**Targets:** ${c.targets.slice(0, 12).join(', ')}`);
      L.push('');
    }
  }
  L.push('', '## Findings', '', `${S.findings.length} total — ` +
    ['critical', 'high', 'medium', 'low', 'info'].map(k => `${sev[k] || 0} ${k}`).join(', '), '');
  for (const f of S.findings) {
    L.push(`### ${f.id} · ${f.severity.toUpperCase()} (${f.score}) — ${f.title}`, '',
      `*${f.category} · ${f.det} · ${fmtTs(f.from)} → ${fmtTs(f.to)} · confidence ${(f.confidence * 100).toFixed(0)}%*`, '');
    const m = Object.entries(f.metrics || {}).filter(([, v]) => v != null);
    if (m.length) L.push(m.map(([k, v]) => `\`${k}=${v}\``).join(' '), '');
    (f.evidence || []).forEach(e => L.push(`- ${e}`));
    if (f.entities.ips && f.entities.ips.length) L.push('', `**Sources:** ${f.entities.ips.slice(0, 20).join(', ')}`);
    if (f.entities.paths && f.entities.paths.length) L.push(`**Endpoints:** ${f.entities.paths.slice(0, 10).join(', ')}`);
    if (f.mitre && f.mitre.length) L.push(`**ATT&CK:** ${f.mitre.join(', ')}`);
    L.push('', `> **Recommended action.** ${f.action}`, '');
    if (f.query) L.push(`Pivot: \`${f.query}\``, '');
  }
  L.push('---', '', '*Generated in-browser by Alteon Log Analyzer. No data left this machine.*');
  return L.join('\n');
}

/* ------------------------------ actions ------------------------------ */
const DEFAULT_CFG = { timeUnit: 'auto', allowlist: [], burstZ: 6, burstMinRps: 20, srcFloodRps: 30, srcFloodTotal: 500, scanUniquePaths: 40,
  scan404Ratio: .35, credFail: 25, credSprayHosts: 15, slowMs: 20000, satP95Mult: 3, dnaEps: .14,
  dnaMinCohort: 6, beaconCV: .18, beaconMin: 25, exfilSigma: 4, minConfidence: .35 };
S.cfg = Object.assign({}, DEFAULT_CFG);
S.rowLimit = 3000000;
S.overrides = {};
S.files = [];
S.tzOffsetMin = 0;

async function applyQuery() {
  const q = $('#q').value.trim();
  busy(true, 'filtering');
  try {
    const r = await rpc('query', { q, range: S.range });
    S.q = q; S.sum = r.summary; S.dna = null; S.tops = {};
    refreshStatus();
    if (!r.count) showErr('That filter matches no requests.');
    await render(S.tab);
  } catch (e) { showErr('Filter error: ' + e.message); }
  busy(false);
}
async function analyze() {
  busy(true, 'running 24 detectors');
  try {
    await rpc('config', S.cfg);
    const r = await rpc('analyze', {});
    S.findings = r.findings; S.campaigns = r.campaigns || []; S.dna = null;
    const b = $('#navcount');
    if (b) { b.textContent = S.findings.length; b.style.display = S.findings.length ? '' : 'none'; }
    const cb = $('#campcount');
    if (cb) { cb.textContent = S.campaigns.length; cb.style.display = S.campaigns.length ? '' : 'none'; }
    busy(false, `analysis complete in ${r.ms} ms`);
    go(S.campaigns.length ? 'campaigns' : 'detections');
  } catch (e) { showErr('Analysis failed: ' + e.message); busy(false); }
}
async function ingest(files) {
  if (!files || !files.length) return;
  busy(true, 'ingesting'); $('#prog').style.width = '4%';
  try {
    await rpc('reset', {});
    await rpc('config', S.cfg);
    S.files = Array.from(files);
    await rpc('config', Object.assign({}, S.cfg, { tzOffsetMin: S.tzOffsetMin || 0 }));
    const r = await rpc('ingest', { files: S.files, rowLimit: S.rowLimit, overrides: S.overrides || {} });
    S.sum = r.summary; S.loaded = true; S.findings = []; S.campaigns = []; S.dna = null; S.q = ''; S.range = null; $('#q').value = '';
    $('#btnAnalyze').disabled = false;
    $('#prog').style.width = '100%'; setTimeout(() => $('#prog').style.width = '0', 600);
    refreshStatus(); busy(false, `${fmtN(S.sum.totalRows)} rows ready`);
    go('overview');
    setTimeout(analyze, 60);
  } catch (e) { showErr('Ingest failed: ' + e.message); busy(false); $('#prog').style.width = '0'; }
}

buildNav(); renderEmpty(); busy(false);
$('#btnLoad').onclick = () => $('#file').click();
$('#file').onchange = e => ingest(e.target.files);

$('#q').addEventListener('keydown', e => { if (e.key === 'Enter') applyQuery(); });
let dragDepth = 0;
window.addEventListener('dragenter', e => { e.preventDefault(); if (++dragDepth === 1) $('#drop').classList.add('on'); });
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('dragleave', e => { if (--dragDepth <= 0) { dragDepth = 0; $('#drop').classList.remove('on'); } });
window.addEventListener('drop', e => {
  e.preventDefault(); dragDepth = 0; $('#drop').classList.remove('on');
  if (e.dataTransfer.files && e.dataTransfer.files.length) ingest(e.dataTransfer.files);
});
window.addEventListener('resize', debounce(() => {
  if (S.tab === 'overview' && S.series && $('#cvTL')) {
    drawTimeline($('#cvTL'), S.series, { onBrush: r => { S.range = r; applyQuery(); } });
    if (S.lastHeat) drawHeat($('#cvHeat'), S.lastHeat);
  }
}, 220));
window.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#dossier').classList.contains('on')) { closeDossier(); return; }
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') { if (e.key === 'Escape') e.target.blur(); return; }
  if (e.key === '/') { e.preventDefault(); $('#q').focus(); return; }
  const i = TABS.findIndex(t => t[2].toLowerCase() === e.key.toLowerCase());
  if (i >= 0 && S.loaded) go(TABS[i][0]);
});
