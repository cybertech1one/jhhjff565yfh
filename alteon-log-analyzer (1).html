<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alteon Log Analyzer — ADC / AppWall traffic forensics</title>
<style>
:root{
  --chassis:#0A0E13; --panel:#111922; --panel2:#0D141B; --raise:#16212C; --rule:#1D2A37; --rule2:#26374a;
  --ink:#D8E4EF; --ink2:#9FB3C6; --muted:#68809A;
  --amber:#FFB020; --trace:#37D0E0; --coral:#FF5C6C; --mint:#43D6A0; --violet:#9B7BFF; --rose:#FF7BB0;
  --crit:#FF5C6C; --high:#FF8A3D; --med:#FFB020; --low:#37D0E0; --info:#68809A;
  --lbl:"Roboto Condensed","Archivo Narrow","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:3px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--chassis);color:var(--ink);font-family:var(--body);font-size:13px;overflow:hidden;
  background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px)}
button,input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--panel2)}
::-webkit-scrollbar-thumb{background:#22303f;border:2px solid var(--panel2);border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:#2f4256}
:focus-visible{outline:2px solid var(--trace);outline-offset:1px}

/* silkscreen labels — the appliance vernacular */
.lbl{font-family:var(--lbl);text-transform:uppercase;letter-spacing:.14em;font-weight:700;font-size:10px;color:var(--muted)}
.mono{font-family:var(--mono)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

#app{display:grid;grid-template-rows:auto auto 1fr auto;height:100vh}

/* ---------- chassis header ---------- */
header{display:flex;align-items:center;gap:14px;padding:9px 14px;background:linear-gradient(180deg,#101922,#0B1219);
  border-bottom:1px solid var(--rule)}
.brand{display:flex;align-items:baseline;gap:9px;white-space:nowrap}
.brand b{font-family:var(--lbl);font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink)}
.brand i{font-style:normal;font-family:var(--lbl);font-size:9px;letter-spacing:.22em;color:var(--amber);
  border:1px solid #3a2c10;background:#1b1508;padding:2px 6px;border-radius:2px}
.lamp{width:7px;height:7px;border-radius:50%;background:#2b3d4d;box-shadow:0 0 0 2px #0c1218}
.lamp.on{background:var(--mint);box-shadow:0 0 8px var(--mint),0 0 0 2px #0c1218}
.lamp.busy{background:var(--amber);box-shadow:0 0 8px var(--amber),0 0 0 2px #0c1218;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
header .spacer{flex:1}
.btn{background:var(--raise);border:1px solid var(--rule2);color:var(--ink);padding:6px 11px;border-radius:var(--r);
  cursor:pointer;font-family:var(--lbl);text-transform:uppercase;letter-spacing:.1em;font-size:10px;font-weight:700;
  transition:background .12s,border-color .12s}
.btn:hover{background:#1d2c3a;border-color:#35506b}
.btn.primary{background:#12313a;border-color:#1c5f6e;color:#8ff0fb}
.btn.primary:hover{background:#164351}
.btn.warn{background:#2a1f08;border-color:#5c4413;color:var(--amber)}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ---------- query strip ---------- */
.qbar{display:flex;gap:8px;align-items:center;padding:7px 14px;background:var(--panel2);border-bottom:1px solid var(--rule)}
.qwrap{flex:1;display:flex;align-items:center;gap:8px;background:#0A1017;border:1px solid var(--rule2);border-radius:var(--r);padding:0 9px}
.qwrap:focus-within{border-color:#2c6b7d;box-shadow:0 0 0 1px #12313a}
.qwrap input{flex:1;background:none;border:0;outline:0;padding:8px 0;font-family:var(--mono);font-size:12.5px;color:var(--ink)}
.qwrap input::placeholder{color:#4b6178}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--raise);border:1px solid var(--rule2);
  border-radius:2px;padding:2px 7px;font-family:var(--mono);font-size:11px;color:var(--ink2);white-space:nowrap}
.chip b{color:var(--trace);font-weight:600}
.chip x{cursor:pointer;color:var(--muted);font-style:normal}
.chip x:hover{color:var(--coral)}

/* ---------- body ---------- */
main{display:grid;grid-template-columns:168px 1fr;min-height:0}
nav{background:var(--panel2);border-right:1px solid var(--rule);padding:10px 0;overflow-y:auto}
nav .grp{padding:12px 14px 5px;font-family:var(--lbl);font-size:9px;letter-spacing:.18em;color:#41566b}
nav button{display:flex;width:100%;align-items:center;gap:9px;background:none;border:0;border-left:2px solid transparent;
  padding:8px 14px;cursor:pointer;text-align:left;color:var(--ink2);font-family:var(--lbl);text-transform:uppercase;
  letter-spacing:.1em;font-size:10.5px;font-weight:700}
nav button:hover{background:#111a23;color:var(--ink)}
nav button.on{background:#0F1B24;border-left-color:var(--amber);color:var(--ink)}
nav button .k{font-family:var(--mono);font-size:9px;color:#3c5468}
nav button .badge{margin-left:auto;background:#2a1216;color:var(--coral);border:1px solid #4a1f26;border-radius:8px;
  padding:0 6px;font-size:9.5px;font-family:var(--mono)}
section.view{overflow:auto;padding:16px;display:none}
section.view.on{display:block}

/* ---------- panels ---------- */
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);margin-bottom:14px}
.panel>h3{margin:0;padding:9px 12px;border-bottom:1px solid var(--rule);font-family:var(--lbl);font-size:10px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--ink2);display:flex;align-items:center;gap:8px}
.panel>h3 small{margin-left:auto;color:var(--muted);font-weight:400;letter-spacing:.06em;text-transform:none;font-family:var(--body);font-size:11px}
.panel .body{padding:12px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1200px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g2{grid-template-columns:1fr}}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);padding:10px 12px;position:relative;overflow:hidden}
.kpi:after{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--rule2)}
.kpi.ok:after{background:var(--mint)}.kpi.warn:after{background:var(--amber)}.kpi.bad:after{background:var(--coral)}
.kpi .v{font-family:var(--mono);font-size:21px;font-variant-numeric:tabular-nums;letter-spacing:-.01em;line-height:1.15}
.kpi .s{font-size:11px;color:var(--muted);margin-top:3px}

/* findings */
.finding{background:var(--panel);border:1px solid var(--rule);border-left:3px solid var(--info);border-radius:var(--r);margin-bottom:10px}
.finding.critical{border-left-color:var(--crit)}.finding.high{border-left-color:var(--high)}
.finding.medium{border-left-color:var(--med)}.finding.low{border-left-color:var(--low)}
.finding>.hd{display:flex;gap:11px;align-items:flex-start;padding:11px 12px;cursor:pointer}
.finding>.hd:hover{background:#131e28}
.sev{font-family:var(--lbl);font-size:9px;letter-spacing:.13em;padding:3px 6px;border-radius:2px;white-space:nowrap;font-weight:700}
.sev.critical{background:#3a1219;color:#ff8d99}.sev.high{background:#3a2210;color:#ffb27a}
.sev.medium{background:#332708;color:#ffd27a}.sev.low{background:#0e2b31;color:#7fe4f2}.sev.info{background:#1a232c;color:#9db2c6}
.det{font-family:var(--mono);font-size:10px;color:var(--amber);border:1px solid #3a2c10;padding:2px 5px;border-radius:2px;background:#1a1408}
.finding .ttl{flex:1;font-size:13.5px;line-height:1.4}
.finding .ttl em{display:block;font-style:normal;color:var(--muted);font-size:11px;margin-top:3px;font-family:var(--mono)}
.score{font-family:var(--mono);font-size:16px;color:var(--ink2);min-width:30px;text-align:right}
.finding .bd{display:none;padding:0 12px 13px 12px;border-top:1px solid var(--rule)}
.finding.open .bd{display:block}
.mrow{display:flex;flex-wrap:wrap;gap:6px;margin:11px 0}
.metric{background:var(--panel2);border:1px solid var(--rule);border-radius:2px;padding:4px 8px;font-size:11px}
.metric b{font-family:var(--mono);color:var(--trace);font-weight:600;margin-left:5px}
.ev{margin:9px 0 0;padding-left:15px;font-size:12.5px;line-height:1.65;color:var(--ink2)}
.ev li{margin-bottom:3px}
.act{margin-top:11px;padding:9px 11px;background:#0d1a1e;border:1px solid #17434e;border-radius:2px;font-size:12.5px;line-height:1.6}
.act:before{content:"REMEDIATION";display:block;font-family:var(--lbl);font-size:9px;letter-spacing:.16em;color:#4fbdd0;margin-bottom:5px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.tag{font-family:var(--mono);font-size:10px;color:var(--violet);border:1px solid #2f2748;background:#161327;padding:2px 6px;border-radius:2px}
.ents{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.ent{font-family:var(--mono);font-size:11px;background:var(--panel2);border:1px solid var(--rule);padding:2px 6px;border-radius:2px;cursor:pointer}
.ent:hover{border-color:var(--trace);color:var(--trace)}

/* tables */
table{width:100%;border-collapse:collapse;font-size:12px}
th{position:sticky;top:0;background:var(--panel2);text-align:left;padding:7px 9px;border-bottom:1px solid var(--rule2);
  font-family:var(--lbl);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);cursor:pointer;white-space:nowrap;z-index:2}
th:hover{color:var(--ink)}
td{padding:5px 9px;border-bottom:1px solid #16202a;font-family:var(--mono);font-size:11.5px;white-space:nowrap;
  max-width:340px;overflow:hidden;text-overflow:ellipsis}
tbody tr:hover{background:#141f29}
.tbl-wrap{max-height:560px;overflow:auto;border:1px solid var(--rule);border-radius:var(--r)}
td.r,th.r{text-align:right}
.s2{color:var(--mint)}.s3{color:var(--trace)}.s4{color:var(--amber)}.s5{color:var(--coral)}
.bar{height:4px;background:#1b2631;border-radius:2px;overflow:hidden;min-width:52px}
.bar i{display:block;height:100%;background:var(--trace)}

/* facets */
.facet{margin-bottom:3px}
.facet .row{display:flex;align-items:center;gap:8px;padding:3px 5px;border-radius:2px;cursor:pointer}
.facet .row:hover{background:#16222d}
.facet .nm{flex:1;font-family:var(--mono);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.facet .ct{font-family:var(--mono);font-size:11px;color:var(--muted)}
.facet .bar{width:72px;flex:none}

/* dropzone */
#drop{position:fixed;inset:0;background:rgba(6,10,14,.94);display:none;place-items:center;z-index:50;backdrop-filter:blur(3px)}
#drop.on{display:grid}
#drop div{border:2px dashed var(--trace);border-radius:6px;padding:60px 90px;text-align:center}
#drop b{font-family:var(--lbl);font-size:20px;letter-spacing:.18em;text-transform:uppercase;display:block;color:var(--trace)}

/* empty state */
.empty{max-width:840px;margin:5vh auto;text-align:center}
.empty .art{margin:0 auto 22px;width:100%;max-width:560px}
.empty h1{font-family:var(--lbl);font-size:26px;letter-spacing:.16em;text-transform:uppercase;margin:0 0 8px}
.empty p{color:var(--ink2);line-height:1.7;margin:0 auto 20px;max-width:560px}
.caps{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:9px;margin-top:26px;text-align:left}
.cap{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);padding:10px 12px}
.cap b{display:block;font-family:var(--lbl);font-size:10px;letter-spacing:.12em;color:var(--amber);margin-bottom:4px}
.cap span{font-size:11.5px;color:var(--ink2);line-height:1.5}

/* DNA barcode — the signature element */
.dna{display:flex;align-items:center;gap:9px}
.dnabar{display:flex;height:16px;border:1px solid #14202b;border-radius:2px;overflow:hidden;min-width:128px}
.dnabar i{flex:1;display:block}
.cohort{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);margin-bottom:11px;overflow:hidden}
.cohort .hd{display:flex;align-items:center;gap:11px;padding:10px 12px;border-bottom:1px solid var(--rule);cursor:pointer}
.cohort .hd:hover{background:#131e28}
.cohort .stack{padding:9px 12px;display:none;background:var(--panel2)}
.cohort.open .stack{display:block}
.stackrow{display:flex;align-items:center;gap:9px;padding:1.5px 0}
.stackrow .ip{font-family:var(--mono);font-size:11px;width:132px;color:var(--ink2)}
.stackrow .cy{font-size:10.5px;color:var(--muted);width:104px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dnalegend{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.dnalegend span{font-family:var(--mono);font-size:9.5px;color:var(--muted);display:flex;align-items:center;gap:4px}
.dnalegend i{width:9px;height:9px;border-radius:1px;display:block}

.chain{margin-top:7px;border-left:2px solid var(--rule2);padding-left:11px}
.stage{display:flex;align-items:center;gap:9px;padding:5px 7px;border-radius:2px;cursor:pointer;position:relative}
.stage:hover{background:#16222d}
.stage:before{content:"";position:absolute;left:-16px;width:7px;height:7px;border-radius:50%;background:var(--rule2);border:2px solid var(--panel)}
.stage .ph{font-family:var(--lbl);font-size:9px;letter-spacing:.11em;text-transform:uppercase;border:1px solid;
  border-radius:2px;padding:2px 5px;width:110px;text-align:center;flex:none;letter-spacing:.06em}
.stage .st{flex:1;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.warn-banner{background:#2a1f08;border:1px solid #5c4413;color:var(--amber);padding:10px 13px;border-radius:var(--r);
  margin-bottom:13px;font-size:12.5px;line-height:1.6}
.warn-banner b{color:#ffd27a}
.maprow{display:grid;grid-template-columns:112px 1fr 74px;gap:9px;align-items:center;padding:4px 0;border-bottom:1px solid #16202a}
.maprow .cf{font-family:var(--mono);font-size:11.5px;color:var(--trace)}
.maprow select{width:100%;background:#0A1017;border:1px solid var(--rule2);border-radius:2px;padding:4px 6px;
  font-family:var(--mono);font-size:11px;color:var(--ink)}
.maprow .fillbar{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.maprow .fillbar span{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
/* entity dossier drawer — the drill target */
#scrim{position:fixed;inset:0;background:rgba(4,7,10,.62);z-index:60;display:none;backdrop-filter:blur(2px)}
#scrim.on{display:block}
#dossier{position:fixed;top:0;right:0;bottom:0;width:min(780px,94vw);background:var(--chassis);
  border-left:1px solid var(--rule2);z-index:61;transform:translateX(102%);transition:transform .18s ease-out;
  display:flex;flex-direction:column;box-shadow:-18px 0 48px rgba(0,0,0,.5)}
#dossier.on{transform:none}
#dossier .dh{display:flex;align-items:center;gap:11px;padding:12px 15px;border-bottom:1px solid var(--rule);
  background:linear-gradient(180deg,#101922,#0B1219)}
#dossier .dh .kind{font-family:var(--lbl);font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--amber);border:1px solid #3a2c10;background:#1a1408;padding:3px 7px;border-radius:2px}
#dossier .dh .val{font-family:var(--mono);font-size:15px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#dossier .db{overflow-y:auto;padding:14px 15px;flex:1}
#dossier .x{background:none;border:1px solid var(--rule2);color:var(--ink2);width:26px;height:26px;
  border-radius:2px;cursor:pointer;font-size:14px;line-height:1}
#dossier .x:hover{border-color:var(--coral);color:var(--coral)}
.dstat{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:7px;margin-bottom:13px}
.dstat div{background:var(--panel);border:1px solid var(--rule);border-radius:2px;padding:7px 9px}
.dstat .v{font-family:var(--mono);font-size:15px}
.dsec{margin-bottom:15px}
.dsec>.lbl{margin-bottom:6px;display:block}
.minirow{display:flex;align-items:center;gap:8px;padding:2px 0;font-size:11.5px}
.minirow .n{flex:1;font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.minirow .n:hover{color:var(--trace)}
.minirow .c{font-family:var(--mono);color:var(--muted);width:58px;text-align:right}
.rec{border:1px solid var(--rule);border-radius:2px;margin-bottom:5px;background:var(--panel)}
.rec>summary{cursor:pointer;padding:6px 9px;font-family:var(--mono);font-size:11px;color:var(--ink2);list-style:none}
.rec>summary::-webkit-details-marker{display:none}
.rec>summary:before{content:"▸ ";color:var(--muted)}
.rec[open]>summary:before{content:"▾ "}
.rec>summary:hover{background:#16222d}
.recgrid{display:grid;grid-template-columns:150px 1fr;gap:1px 10px;padding:8px 11px;border-top:1px solid var(--rule);
  font-family:var(--mono);font-size:11px}
.recgrid b{color:var(--muted);font-weight:400}
.recgrid span{overflow-wrap:anywhere}
.recgrid .xf b{color:var(--violet)}
/* pivot */
.pivot{overflow:auto;border:1px solid var(--rule);border-radius:var(--r)}
.pivot table{font-family:var(--mono);font-size:11px}
.pivot td{text-align:right;cursor:pointer;padding:5px 8px;border-bottom:1px solid #16202a}
.pivot td.rh{text-align:left;color:var(--ink);position:sticky;left:0;background:var(--panel);z-index:1;max-width:230px}
.pivot td:hover{outline:1px solid var(--trace)}
.pivot th{white-space:nowrap}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:11px}
.ctl select{background:#0A1017;border:1px solid var(--rule2);border-radius:2px;padding:5px 8px;
  font-family:var(--mono);font-size:11.5px;color:var(--ink)}
/* misc */
.hint{font-size:11.5px;color:var(--muted);line-height:1.6}
.hint code{font-family:var(--mono);background:var(--panel2);border:1px solid var(--rule);padding:1px 4px;border-radius:2px;color:var(--trace);font-size:11px}
footer{display:flex;gap:16px;align-items:center;padding:6px 14px;background:var(--panel2);border-top:1px solid var(--rule);
  font-family:var(--mono);font-size:10.5px;color:var(--muted)}
footer .sep{width:1px;height:11px;background:var(--rule2)}
.prog{height:2px;background:var(--rule);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--trace),var(--amber));transition:width .2s}
canvas{display:block;width:100%}
.tune{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid #16202a}
.tune label{font-size:12px}.tune .d{font-size:10.5px;color:var(--muted)}
.tune input{width:96px;background:#0A1017;border:1px solid var(--rule2);border-radius:2px;padding:4px 7px;font-family:var(--mono);font-size:11.5px}
.err{background:#2a1216;border:1px solid #5a1f28;color:#ff9aa4;padding:9px 12px;border-radius:var(--r);margin-bottom:12px;font-size:12.5px}
.pill{font-family:var(--mono);font-size:10px;padding:1px 5px;border-radius:2px;border:1px solid var(--rule2);color:var(--ink2)}
.pill.bad{background:#2a1216;border-color:#5a1f28;color:#ff9aa4}
.pill.ok{background:#0e2a20;border-color:#1d5741;color:#7ce0b8}
.pill.au{background:#241a08;border-color:#5c4413;color:var(--amber)}
</style>
</head>
<body>
<div id="drop"><div><b>Drop log files</b><span class="hint">CSV · TSV · JSON · NDJSON · CEF · W3C · Apache · .gz — multiple files merge into one timeline</span></div></div>
<div id="scrim"></div>
<aside id="dossier" aria-hidden="true"><div class="dh"><span class="kind" id="dKind"></span>
  <span class="val" id="dVal"></span>
  <button class="btn" id="dFilter">Filter to this</button>
  <button class="x" id="dClose" aria-label="Close">✕</button></div>
  <div class="db" id="dBody"></div></aside>
<div id="app">
<header>
  <span class="lamp" id="lamp"></span>
  <span class="brand"><b>Alteon</b><i>Log Analyzer</i></span>
  <span class="lbl" id="hdrfiles">no data loaded</span>
  <span class="spacer"></span>
  <button class="btn primary" id="btnLoad">Load logs</button>
  <button class="btn" id="btnSample">Demo data</button>
  <button class="btn warn" id="btnAnalyze" disabled>Run analysis</button>
